# Workspace member generated from packages/_template by scripts/new-package.sh.
# Dev tools (ruff, mypy, pytest) come from the root project's `dev` group; `make setup` installs them.
[project]
name = "neptune-deploy"
version = "0.0.1"
description = "neptune-deploy: a Neptune workspace member."
requires-python = ">=3.11"
authors = [{ name = "Benjamin Tay", email = "benjamintay07@gmail.com" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptune_deploy"]

# Shared lint rules live in the root pyproject; paths below are relative to this package.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = [
  "integration: exercises multiple components against real fixtures",
  "slow: takes more than a few seconds; excluded by `make test-fast`",
]
