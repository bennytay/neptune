# Workspace member: the site model, neptune_memory.site (docs/site-model/).
# Dev tools (ruff, mypy, pytest) come from the root project's `dev` group; `make setup` installs them.
[project]
name = "neptune-memory"
version = "0.0.1"
description = "Neptune Memory: the site model (neptune_memory.site), a cited fact log of one robot site."
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Benjamin Tay", email = "benjamintay07@gmail.com" }]
dependencies = ["neptune"]

# The live site (#202): an MQTT client, and a pure-pip broker so `make site-live` needs no Docker.
[dependency-groups]
live = ["amqtt>=0.11", "paho-mqtt>=2.1"]

# `python -m neptune_memory.site extract-photos`. Optional: the build reads the recorded
# extraction and never calls a model; `uv sync --extra anthropic` to re-record from real photos.
[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
neptune = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/neptune_memory"]

# Shared lint rules live in the root pyproject; paths below are relative to this package.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

# `anthropic` is an optional extra, imported only inside site/derived/photos.py; CI does not install it.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = [
  "integration: exercises multiple components against real fixtures",
  "slow: takes more than a few seconds; excluded by `make test-fast`",
]

# amqtt (the live demo's broker, #202) ships no type information.
[[tool.mypy.overrides]]
module = ["amqtt", "amqtt.*"]
ignore_missing_imports = true
