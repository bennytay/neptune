<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neptune</title>
<style>
:root { color-scheme: light;
  --backdrop: #efefed; --bg: #fafaf9; --card: #ffffff; --pane: #f6f6f4; --ink: #141414; --muted: #6b6b6b; --faint: #a6a6a3;
  --line: #e7e7e4; --hover: #f0f0ee; --accent: #3b6fe6; --sel: rgba(59,111,230,.10); --solid: #141414; --on-solid: #ffffff;
  --ok: #3f9a6b; --warn: #c58a2b; --fault: #d1584c; --idle: #5d86c7; --stale: #9a9ea4;
  --g-place: #9aa6b4; --g-asset: #141414; --g-people: #8a6fc9; --g-work: #c58a2b; --g-docs: #3d9a97;
  --g-mission: #3f9a6b; --g-improve: #3b6fe6;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04); --lift: 0 6px 16px rgba(0,0,0,.18);
  --mono: "Geist Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sky-a: #dbe8f7; --sky-b: #f4f7fb; --hill-a: #c9dcc0; --hill-b: #9fbf92; --metal: #2a2d31;
}
:root[data-theme="dark"] { color-scheme: dark;
  --backdrop: #0b0b0c; --bg: #111113; --card: #17171a; --pane: #0e0e10; --ink: #ececec; --muted: #8d8d92; --faint: #5d5d62;
  --line: #26262a; --hover: #1e1e22; --accent: #7aa2f7; --sel: rgba(122,162,247,.14); --solid: #ececec; --on-solid: #111113;
  --ok: #5fb98a; --warn: #d9a54d; --fault: #e2766a; --idle: #7fa3dc; --stale: #6f747b;
  --g-place: #5f6b78; --g-asset: #ececec; --g-people: #a68ee0; --g-work: #d9a54d; --g-docs: #5cb8b4;
  --g-mission: #5fb98a; --g-improve: #7aa2f7;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --lift: 0 6px 16px rgba(0,0,0,.5);
  --sky-a: #1b2433; --sky-b: #17171a; --hill-a: #24302a; --hill-b: #2f4034; --metal: #d6d6d6;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--backdrop); color: var(--ink); font: 12.5px/1.55 var(--mono); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
svg.i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.lbl { font: 500 10.5px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--stale); flex: none; }
.dot.on, .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.fault { background: var(--fault); }
.dot.idle { background: var(--idle); } .dot.stale, .dot.unknown { background: transparent; border: 1px solid var(--stale); }
.dot.none { background: transparent; border: 1px solid var(--line); }
.dot.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }

.app { height: 100%; display: grid; grid-template-columns: 236px minmax(0, 1fr) 360px; gap: 0; }
.pane { min-height: 0; overflow: auto; }

/* sidebar */
.left { background: var(--pane); padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.brandrow { display: flex; align-items: center; gap: 10px; padding: 0 4px 14px; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: var(--solid); color: var(--on-solid); display: grid; place-items: center; flex: none; }
.logo svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brandrow b { display: block; font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; }
.brandrow small { display: block; font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 160px; }
.search { position: relative; margin: 0 0 14px; }
.search svg { position: absolute; left: 10px; top: 9px; color: var(--muted); }
.search input { width: 100%; background: var(--hover); border: 1px solid transparent; border-radius: 9px; padding: 7px 34px 7px 31px; outline: none; }
.search input:focus { border-color: var(--line); background: var(--card); }
.search kbd { position: absolute; right: 8px; top: 7px; font: 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--card); }
.side-lbl { font-size: 10.5px; color: var(--faint); padding: 0 6px 4px; display: flex; justify-content: space-between; align-items: center; }
.nav { display: flex; flex-direction: column; gap: 2px; margin: 0 0 14px; }
.nav button { all: unset; cursor: pointer; padding: 7px 9px; border-radius: 8px; display: flex; gap: 9px; align-items: center; color: var(--muted); }
.nav button:hover { background: var(--hover); color: var(--ink); }
.nav button.on { background: var(--solid); color: var(--on-solid); box-shadow: var(--lift); }
.nav .n { margin-left: auto; font: 10px var(--mono); color: var(--muted); background: var(--hover); border-radius: 5px; padding: 0 5px; min-width: 16px; text-align: center; }
.nav .n:empty { display: none; }
.nav button.on .n { background: rgba(255,255,255,.16); color: inherit; }
.section { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; min-height: 0; flex: 1; }
.section .hd { display: flex; align-items: center; gap: 8px; padding: 0 6px 6px; font-weight: 500; }
.section .hd select { margin-left: auto; background: transparent; border: 1px solid var(--line); border-radius: 6px; font-size: 10.5px; padding: 1px 4px; color: var(--muted); max-width: 96px; }
.things { flex: 1; overflow: auto; margin: 0 0 0 14px; border-left: 1px solid var(--line); padding-left: 4px; }
.thing { all: unset; display: grid; grid-template-columns: 10px 1fr; column-gap: 8px; align-items: center; width: 100%; padding: 4px 8px; border-radius: 6px; cursor: pointer; box-sizing: border-box; font-size: 11.5px; color: var(--muted); }
.thing:hover { background: var(--hover); color: var(--ink); } .thing.on { background: var(--hover); color: var(--ink); }
.thing .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thing .id { display: none; }
.foot { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.foot a.row { display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: 8px; color: var(--muted); text-decoration: none; }
.foot a.row:hover { background: var(--hover); color: var(--ink); }
.livecard { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; box-shadow: var(--shadow); }
.livecard .av { width: 28px; height: 28px; border-radius: 7px; background: var(--hover); display: grid; place-items: center; flex: none; }
.livecard b { display: block; font-weight: 500; font-size: 11.5px; }
.livecard small { display: block; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--hover); border-radius: 9px; padding: 3px; }
.seg button { all: unset; cursor: pointer; font-size: 10.5px; text-align: center; padding: 4px 0; border-radius: 7px; color: var(--muted); display: flex; gap: 5px; align-items: center; justify-content: center; }
.seg button svg.i { width: 12px; height: 12px; }
.seg button.on { background: var(--solid); color: var(--on-solid); box-shadow: var(--lift); }

/* main sheet */
.sheet { margin: 8px 0 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: var(--shadow); }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 22px 0; }
.crumb { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; background: var(--hover); border-radius: 8px; padding: 5px 10px; color: var(--muted); font-size: 11.5px; }
.crumb:hover { color: var(--ink); }
.topbar .tr { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.iconbtn { all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { color: var(--ink); }
.pill { font: 10.5px var(--mono); color: var(--muted); border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 9px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.center { position: relative; flex: 1; min-height: 0; overflow: auto; }

.view { padding: 16px 22px 40px; max-width: 1180px; }
.view[hidden], [hidden] { display: none !important; }
.view h1 { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin: 4px 0 2px; }
.sub { color: var(--muted); margin-bottom: 22px; }
.block { margin: 26px 0 0; } .block > .lbl { display: flex; justify-content: space-between; margin-bottom: 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }

/* overview */
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 1.15fr); min-height: 190px; }
.hero .copy { padding: 26px 26px 24px; position: relative; z-index: 1; }
.hero .eyebrow { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: 28px; margin: 8px 0 6px; }
.hero p { color: var(--muted); margin: 0 0 22px; }
.hero .art { position: relative; }
.hero .art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero .art::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(90deg, var(--card) 0%, transparent 28%); pointer-events: none; }
.acts-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { all: unset; cursor: pointer; font: 11px var(--mono); padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); white-space: nowrap; display: inline-flex; gap: 7px; align-items: center; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--solid); color: var(--on-solid); border-color: var(--solid); box-shadow: var(--lift); }
.btn.big { padding: 10px 15px; font-size: 11.5px; border-radius: 10px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.tabsrow { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 18px; gap: 12px; flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--hover); border-radius: 11px; padding: 4px; gap: 2px; }
.tabs button { all: unset; cursor: pointer; padding: 6px 16px; border-radius: 8px; font-size: 11.5px; color: var(--muted); }
.tabs button:hover { color: var(--ink); }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.ovgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 22px; align-items: start; }
.h2 { display: flex; gap: 9px; align-items: center; font-size: 14px; font-weight: 500; margin: 0 0 12px; }
.h2 .aside { margin-left: auto; font-size: 10.5px; color: var(--faint); font-weight: 400; }
.sect + .sect { margin-top: 26px; }
.cards2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tcard { padding: 14px 16px 12px; display: flex; flex-direction: column; min-height: 150px; cursor: pointer; transition: border-color .15s; }
.tcard:hover, .vcard:hover { border-color: var(--faint); }
.tcard .top { display: flex; gap: 10px; align-items: flex-start; }
.tcard .top b { font-weight: 500; font-size: 13px; display: block; }
.tcard .top small { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tcard .ico { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); flex: none; }
.tcard .big { font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin-top: 14px; line-height: 1.2; word-break: break-word; }
.tcard .big.long { font-size: 14px; letter-spacing: 0; }
.tcard .cap { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.tcard .chart { margin-top: auto; padding-top: 10px; height: 64px; display: flex; align-items: flex-end; gap: 2px; }
.tcard .chart i { flex: 1; background: var(--faint); border-radius: 1px; min-height: 2px; opacity: .55; }
.tcard .chart i.hi { background: var(--ink); opacity: .85; }
.kindbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: auto; gap: 2px; }
.kindbar i { display: block; }
.legend { display: flex; gap: 12px; font-size: 10px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
.vcard { padding: 10px; display: flex; flex-direction: column; cursor: pointer; transition: border-color .15s; }
.vcard .pic { position: relative; height: 92px; border-radius: 9px; background: var(--hover); overflow: hidden; display: grid; place-items: center; }
.vcard .pic .rk { font-size: 40px; font-weight: 600; letter-spacing: -.04em; color: var(--faint); opacity: .7; }
.vcard .pic .ico { position: absolute; left: 8px; top: 8px; width: 24px; height: 24px; border-radius: 7px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.vcard .pic .ico svg.i { width: 13px; height: 13px; }
.vcard .pic svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.vcard b { font-weight: 500; font-size: 12.5px; margin: 12px 4px 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vcard p { margin: 0 4px 12px; color: var(--muted); font-size: 11px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.vcard .ft { margin: auto 4px 2px; display: flex; justify-content: space-between; align-items: center; font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 9px; gap: 6px; }
.vcard .ft span { display: inline-flex; gap: 5px; align-items: center; }
.empty { padding: 22px; color: var(--muted); text-align: center; border-style: dashed; box-shadow: none; cursor: pointer; }
.feed .r:first-child { border-top: 0; }
.feed { padding: 4px 14px; }
.side { padding: 10px; }
.prow { display: flex; gap: 11px; align-items: center; padding: 9px 8px; border-radius: 9px; cursor: pointer; }
.prow + .prow { border-top: 1px solid var(--line); border-radius: 0; }
.prow:hover { background: var(--hover); border-radius: 9px; }
.prow .ico { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); flex: none; background: var(--card); }
.prow .nm { flex: 1; min-width: 0; }
.prow .nm b { display: block; font-weight: 500; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .nm small { display: block; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grade { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--hover); border-radius: 5px; padding: 1px 6px; flex: none; }
.grade.ok { color: var(--ok); } .grade.warn { color: var(--warn); } .grade.fault { color: var(--fault); } .grade.idle { color: var(--idle); }
.qstats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qs { padding: 11px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.qs .ico { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); flex: none; }
.qs .v { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.qs small { display: block; font-size: 10px; color: var(--muted); }
.qs.alert .v { color: var(--warn); }

.rows { border-top: 1px solid var(--line); }
.r { display: flex; gap: 12px; align-items: baseline; padding: 9px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.feed .r:last-child { border-bottom: 0; }
.r:hover { background: var(--hover); }
.r .t { font: 11px var(--mono); color: var(--faint); min-width: 64px; flex: none; }
.r .k { font: 10.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; min-width: 82px; flex: none; }
.r .x { flex: 1; min-width: 0; }
.r .e { color: var(--muted); font-size: 12px; flex: none; }
.tag { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.tag.inferred { border-style: dashed; } .tag.stale, .tag.unknown { color: var(--warn); } .tag.fault { color: var(--fault); border-color: var(--fault); }
.tag.up { color: var(--ok); } .tag.down { color: var(--warn); } .tag.new { color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--mono); font-size: 12px; }
.cite { font: 11px var(--mono); color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--faint); cursor: pointer; }
.cite:hover { color: var(--accent); border-color: var(--accent); }
.ref { color: var(--accent); cursor: pointer; text-decoration: none; }
.ref:hover { text-decoration: underline; }

/* graph */
#v-graph { padding: 0; max-width: none; position: absolute; inset: 0; }
#gsvg { width: 100%; height: 100%; display: block; cursor: grab; }
#gsvg.drag { cursor: grabbing; }
.gbar { position: absolute; top: 12px; left: 18px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; z-index: 2; }
.gbar button { all: unset; cursor: pointer; font: 10.5px var(--mono); padding: 4px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); background: var(--card); display: inline-flex; gap: 6px; align-items: center; box-shadow: var(--shadow); }
.gbar button.off { opacity: .4; } .gbar button i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.gcard { position: absolute; left: 18px; right: 18px; bottom: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; z-index: 2; max-height: 42%; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
.gcard .hd { display: flex; gap: 10px; align-items: baseline; }
.gcard .hd b { font-size: 14px; font-weight: 600; }
svg text { font-family: var(--mono); }
.edge { stroke: var(--line); stroke-width: 1; }
.edge.hi { stroke: var(--accent); stroke-width: 1.4; }
.edge.dim, .node.dim { opacity: .14; transition: opacity .4s; }
.edge.lit { stroke: var(--accent); stroke-width: calc(var(--sw, 1) * 1.8px); }
.node.focus text { fill: var(--ink); font-weight: 500; }
.ring { fill: none; stroke: var(--accent); stroke-width: calc(var(--sw, 1) * 1.5px); transform-box: fill-box; transform-origin: center; opacity: 0; animation: ping 1.5s ease-out 2 both; }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
.onmap { margin-top: 6px; }
.node { cursor: pointer; } .node text { font-size: var(--fs, 11px); fill: var(--muted); pointer-events: none; }
.edge { stroke-width: calc(var(--sw, 1) * 1px); } .edge.hi { stroke-width: calc(var(--sw, 1) * 1.6px); }
.node.hi text, .node.sel text { fill: var(--ink); font-weight: 500; }

/* lanes */
.lanes { position: relative; margin-top: 4px; }
.lane { display: grid; grid-template-columns: 96px 1fr; align-items: center; height: 30px; border-bottom: 1px solid var(--line); }
.lane .p { font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.lane .bar { position: relative; height: 22px; }
.span { position: absolute; top: 2px; height: 18px; border-radius: 4px; font: 10.5px var(--mono); color: #fff; padding: 0 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 18px; cursor: pointer; opacity: .9; }
.span:hover { opacity: 1; outline: 1px solid var(--ink); }
.axis { display: grid; grid-template-columns: 96px 1fr; height: 18px; }
.axis .ticks { position: relative; font: 10px var(--mono); color: var(--faint); }
.axis .ticks span { position: absolute; transform: translateX(-50%); }

/* improvements */
.key { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.key input { flex: 1; min-width: 180px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; outline: none; }
.key input:focus, .chatbox textarea:focus { border-color: var(--faint); }
.imp { border-top: 1px solid var(--line); padding: 14px 0; }
.imp .hd { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.imp .rk { font: 12px var(--mono); color: var(--faint); width: 18px; }
.imp .tt { font-size: 13.5px; font-weight: 500; flex: 1; min-width: 200px; cursor: pointer; }

async function refresh(force) {
  if (busy) { dirty = true; return; }
  const wait = force ? 0 : 1500 - (Date.now() - last);
  if (wait > 0) { dirty = true; setTimeout(() => { if (dirty) { dirty = false; refresh(true); } }, wait); return; }
  busy = true;

    dash = d; graphData = g; last = Date.now();

    ${t.improvements.length ? `<div class="block"><div class="lbl">Improvements citing it</div><div class="rows">${t.improvements.map((i) => `<div class="r" data-view-go="improvements"><span class="t">#${i.rank}</span><span class="x">${esc(i.title)}</span></div>`).join("")}</div></div>` : ""}
    <div class="block"><div class="lbl">Now</div><table>${now}</table></div>
    ${t.links.length ? `<div class="block"><div class="lbl">Links</div><div>${t.links.map((l) => `<span class="chip" data-thing="${esc(l.other)}">${esc(l.dir === "out" ? l.predicate + " → " : "← " + l.predicate + " ")}${esc(l.other)}</span>`).join("")}</div></div>` : ""}`;
}

// ---- improvements ----------------------------------------------------------------------------
let impError = "";
function drawImprovements() {
  const d = dash, e = d.engine, r = d.run, day = (d.at || "").slice(0, 10);
  const engine = !e.key
    ? `<div class="key"><input type="password" id="apikey" placeholder="Your Anthropic API key" autocomplete="off"><button class="btn primary" data-engine="key">Use key</button></div>
       <div class="muted" style="margin-top:6px;font-size:12px">Held in this server's memory only, never written to disk or the log. Runs and chat are billed to this key (${esc(e.model)}).</div>`
    : `<div class="key"><span class="dot ${e.state === "running" ? "on" : ""}"></span><span class="mono">${e.state === "running" ? "running" : "idle"} · key from ${e.key === "page" ? "this page" : "ANTHROPIC_API_KEY"}</span>
       <span style="margin-left:auto;display:flex;gap:6px"><button class="btn" data-engine="auto">${e.auto ? "Auto: on" : "Auto: off"}</button>${e.key === "page" ? `<button class="btn" data-engine="forget">Forget key</button>` : ""}<button class="btn primary" data-engine="run" ${e.state === "running" ? "disabled" : ""}>Re-evaluate</button></span></div>
       ${e.due ? `<div class="muted mono" style="margin-top:6px">due: ${esc(e.due)}</div>` : ""}`;
  const err = impError || e.error;
  const items = r ? r.items.map((it, i) => {
    const mv = it.move.split(" ")[0];
    const act = it.action && it.action.verb !== "none";
    return `<div class="imp"><div class="hd"><span class="rk">${it.rank}</span><span class="tt" data-fact="${esc(it.fact)}">${esc(it.title)}</span><span class="tag ${esc(mv)}">${esc(it.move)}</span><span class="tag">${esc(it.confidence)}</span>${it.status !== "open" ? `<span class="tag">${esc(it.status)}</span>` : ""}</div>
      <dl>${it.since_last ? `<dt>moved</dt><dd class="muted">${esc(it.since_last)}</dd>` : ""}
        <dt>why</dt><dd>${esc(it.opportunity)}</dd><dt>change</dt><dd>${esc(it.change)}</dd>
        ${it.goals.length ? `<dt>serves</dt><dd>${it.goals.map((g) => esc(g.name)).join(" · ")}</dd>` : ""}
        ${it.constraints.length ? `<dt>constraints</dt><dd>${it.constraints.map((c) => `<span class="ck ${esc(c.status)}"><b>${c.status === "respects" ? "✓" : c.status === "breaks" ? "✗" : "?"}</b> ${esc(c.name)} <span class="muted">· ${esc(c.note)}</span></span>`).join("")}</dd>` : ""}
        <dt>size</dt><dd>${esc(it.size)}</dd>
        ${it.unknowns.length ? `<dt>unknown</dt><dd class="muted">${it.unknowns.map(esc).join("; ")}</dd>` : ""}
        <dt>evidence</dt><dd>${it.evidence.map((x, j) => `<span class="chip" data-ev="${i}:${j}">${esc(x.subject ? `${short(x.subject)} ${x.predicate}` : x.fact)}</span>`).join("")}</dd>
        ${act ? `<dt>action</dt><dd class="mono">${esc(it.action.verb)} ${esc(it.action.target)}${it.action.zone ? " → " + esc(it.action.zone) : ""}</dd>` : ""}</dl>
      ${it.status === "open" ? `<div class="acts"><button class="btn primary" data-imp="accept" data-id="${esc(it.fact)}">${act ? "Accept & send" : "Accept"}</button><button class="btn" data-imp="reject" data-id="${esc(it.fact)}">Reject</button></div>` : ""}</div>`;
  }).join("") : `<div class="muted" style="padding:14px 0;border-top:1px solid var(--line)">${e.key ? "No run yet: Re-evaluate asks Claude." : "Add your key to ask Claude for improvements against the mission."}</div>`;
  const focused = document.activeElement && document.activeElement.id === "apikey";
  if (focused) return;
  $("v-improvements").innerHTML = `
    <div class="lbl">Improvements</div><h1>Against the mission</h1>
    <div class="sub">${r ? `Run ${d.runs} · ${esc(clock(r.at))} · seq ${r.as_of_seq} · ${esc(r.model)} · ${esc(r.trigger || "")}` : "Claude ranks changes from the cited model; you decide."}</div>
    ${engine}${err ? `<div style="color:var(--fault);margin-top:8px" class="mono">${esc(err)}</div>` : ""}
    ${r && r.summary ? `<p style="margin:22px 0 4px;max-width:760px">${esc(r.summary)}</p>` : ""}
    ${r && r.dropped.length ? `<div class="muted mono" title="${esc(r.dropped.join("\n"))}">${r.dropped.length} id(s) not in the model were dropped</div>` : ""}
    <div class="block">${items}</div>
    ${r && r.retired.length ? `<div class="block"><div class="lbl">Retired since the run before</div><div class="rows">${r.retired.map((x) => `<div class="r" data-fact="${esc(x.fact)}"><span class="x">${esc(x.title)}</span><span class="e">${esc(x.reason)}</span></div>`).join("")}</div></div>` : ""}`;
}
async function engineCall(verb) {
  impError = "";
  if (verb === "key") {
    const input = $("apikey") || $("chatkey"), key = input.value.trim();
    if (!key) return;
    input.value = "";
    await post("/api/engine/key", { key });
  } else if (verb === "forget") await post("/api/engine/key", { key: "" });
  else if (verb === "auto") await post("/api/engine/auto", { on: !dash.engine.auto });
  else { const res = await post(`/api/engine/${verb}`, {}); if (!res.ok) impError = (await res.json()).error; }
  document.activeElement && document.activeElement.blur();
  await refresh(true);
  if (!$("msgs").querySelector(".u")) drawChatIntro();
}

// ---- sources ---------------------------------------------------------------------------------
function drawSources() {
  const d = dash, day = (d.at || "").slice(0, 10);
  const max = Math.max(1, ...d.sources.map((s) => s.facts));
  const cls = ["feed", "records", "documents", "inferred"].filter((x) => d.coverage.some((r) => r.counts[x]));
  $("v-sources").innerHTML = `
    <div class="lbl">Sources</div><h1>What Neptune reads</h1><div class="sub">${d.counts.sources} sources · ${d.counts.facts.toLocaleString()} facts</div>
    <table><tr><th>source</th><th>kind</th><th>facts</th><th>latest</th><th>state</th></tr>${d.sources.map((s) => `<tr><td>${esc(s.name)}</td><td class="muted">${esc(s.kind)}</td><td class="num"><span class="bar-s" style="width:${Math.max(2, s.facts / max * 80)}px"></span>${s.facts}</td><td class="num muted">${esc(hms(s.last_seen || s.latest, day))}</td><td>${s.state === "stale" ? `<span class="tag stale">stale</span> <span class="muted">${esc(s.note)}</span>` : s.kind === "feed" ? `<span class="muted">fresh</span>` : ""}</td></tr>`).join("")}</table>
    <div class="block"><div class="lbl"><span>Coverage</span><span>facts about each thing, by evidence</span></div>
    <table class="cov"><tr><th>thing</th>${cls.map((x) => `<th>${x === "feed" ? "live feed" : x}</th>`).join("")}<th>gaps</th></tr>${d.coverage.map((r) => `<tr><td><a class="ref" data-thing="${esc(r.id)}">${esc(r.id)}</a></td>${cls.map((x) => `<td>${r.counts[x] ? `<span class="bar-s" style="width:${Math.min(60, 4 + Math.log2(1 + r.counts[x]) * 7)}px;background:var(--g-${x === "feed" ? "mission" : x === "records" ? "improve" : x === "documents" ? "docs" : "people"})"></span>${r.counts[x]}` : `<span class="faint">·</span>`}</td>`).join("")}<td class="muted">${[r.stale.length ? "stale: " + r.stale.join(", ") : "", r.unknown.length ? "unknown: " + r.unknown.join(", ") : ""].filter(Boolean).map(esc).join(" · ")}</td></tr>`).join("")}</table></div>`;
}

// ---- chat ------------------------------------------------------------------------------------
const talk = "t" + Date.now().toString(36);
function drawChatIntro() {
  const has = dash && dash.engine.key;
  $("msgs").innerHTML = `<div class="muted">Ask anything about ${esc(dash ? dash.site.name : "the site")}. Claude answers from the cited model and shows each step it took.</div>
    ${has ? "" : `<div class="key"><input type="password" id="chatkey" placeholder="Your Anthropic API key" autocomplete="off"><button class="btn primary" data-engine="key">Use key</button></div><div class="faint" style="font-size:12px">Kept in this server's memory only.</div>`}
    <div class="sugs">${["What is going on right now?", "What held up Cell C3 today, and why?", "Who can reset Arm C3 right now?", "What don't we know about the AMR fleet?"].map((q) => `<button data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
}
const CITE = /((?:static|feed|improvements|actions|\.neptune)\/[^\s()]+?) (line \d+|row \d+ col &quot;[^&]*?&quot;|page \d+ block \d+|region [\d,]+|json \/[^\s)]*)|\b((?:robot|machine|cell|zone|area|person|goal|constraint|improvement|work_order|change|rule|document|task|qualification|role|shift|site):[A-Za-z0-9_.\-]*[A-Za-z0-9])|\b(fact:[0-9a-f]{16})\b/g;
function linkify(text) {
  return esc(text).replace(CITE, (m, file, loc, ent, fact) => {
    if (file) return `<a class="cite" data-src-file="${esc(unesc(file))}" data-src-loc="${esc(unesc(loc))}">${m}</a>`;
    if (ent) return `<a class="ref" data-thing="${ent}">${ent}</a>`;
    return `<a class="cite" data-fact="${fact}">${fact.slice(0, 13)}…</a>`;
  });
}
function prose(text) {
  const out = [];
  let list = null;
  for (const raw of String(text).split("\n")) {
    const line = linkify(raw).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
    if (/^\s*[-*] /.test(raw)) { (list ||= []).push(`<li>${line.replace(/^\s*[-*] /, "")}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (raw.trim()) out.push(`<p>${line.replace(/^#+\s*/, "")}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}
let asking = false;
const answers = [];
function focusOn(i) {  // the things an answer rests on, lit in the order it reached them
  const ids = answers[i].filter((id) => pos[id]);
  state.focus = new Set(ids); state.sel = null;
  if (view !== "graph") show("graph"); else drawGraph();
  glide(fit(ids, 70));
}
async function ask(text) {
  text = text.trim();
  if (!text || asking) return;
  if (!$("msgs").querySelector(".u")) $("msgs").innerHTML = "";
  asking = true; $("send").setAttribute("disabled", "");
  $("msgs").insertAdjacentHTML("beforeend", `<div class="u">${esc(text)}</div><div class="a"><span class="thinking">reading the site model</span></div>`);
  const slot = $("msgs").lastElementChild;
  $("msgs").scrollTop = $("msgs").scrollHeight;
  try {
    const res = await post("/api/chat", { id: talk, text });
    const r = await res.json();
    if (!res.ok) { slot.innerHTML = `<span style="color:var(--fault)" class="mono">${esc(r.error)}</span>`; return; }
    const trace = r.trace.length ? `<details class="trace"><summary class="lbl">Trace · ${r.trace.length} step${r.trace.length > 1 ? "s" : ""}</summary>${r.trace.map((s) => `<div class="st"><b>${esc(s.tool)}</b> ${esc(s.input)}${s.head ? "\n" + esc(s.head) : ""}</div>`).join("")}</details>` : "";
    answers.push(r.touched || []);
    const onmap = (r.touched || []).filter((id) => pos[id]).length;
    slot.innerHTML = trace + prose(r.reply) + (onmap > 1 ? `<div class="onmap"><a class="ref lbl" data-focus="${answers.length - 1}">on the graph · ${onmap} things</a></div>` : "");
    if (onmap > 1) focusOn(answers.length - 1);
  } catch (e) {
    slot.innerHTML = `<span style="color:var(--fault)" class="mono">${esc(String(e))}</span>`;
  } finally {
    asking = false; $("send").removeAttribute("disabled");
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }
}
$("send").onclick = () => { ask($("ask").value); $("ask").value = ""; };
$("ask").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });
$("ask").addEventListener("input", () => { $("ask").style.height = "auto"; $("ask").style.height = Math.min(140, $("ask").scrollHeight) + "px"; });
$("clear").onclick = async () => { await post("/api/chat/clear", { id: talk }); answers.length = 0; state.focus = null; drawChatIntro(); if (view === "graph") { drawGraph(); glide(full); } };

// ---- sources drawer --------------------------------------------------------------------------
function citeLink(c) { return `<a class="cite" data-src-file="${esc(c.file)}" data-src-loc="${esc(c.locator)}" data-src-quote="${esc(c.quote || "")}">${esc(c.file.split("/").pop())} ${esc(c.locator)}</a>`; }
function mark(text, quote) {
  const t = esc(text);
  if (!quote) return t;
  const q = esc(quote), i = t.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? t : t.slice(0, i) + "<mark>" + t.slice(i, i + q.length) + "</mark>" + t.slice(i + q.length);
}
function openDrawer(title, sources, top) {
  $("d-title").textContent = title;
  $("d-body").innerHTML = (top || "") + sources.map((s, k) => `<div class="src" id="src-${k}"><div class="head">${esc(s.file)} · ${esc(s.locator)}</div><div class="body"><pre>${esc(s.quote || "")}</pre></div></div>`).join("");
  $("drawer").classList.add("open");
  sources.forEach((s, k) => fetch(`/api/source?file=${encodeURIComponent(s.file)}&locator=${encodeURIComponent(s.locator)}`).then((r) => r.json()).then((x) => {
    const el = document.querySelector(`#src-${k} .body`);
    if (!el) return;
    el.innerHTML = excerpt(x, s.quote);
    const hit = el.querySelector("tr.hit,.hitline,p.hit,mark");
    if (hit) el.scrollTop = Math.max(0, hit.offsetTop - 40);
  }));
}
function excerpt(x, quote) {
  if (x.kind === "lines") return `<pre>${x.lines.map((l) => l.n === x.hit ? `<span class="hitline"><span class="ln">${l.n}</span>${mark(l.text, quote)}</span>\n` : `<span class="ln">${l.n}</span>${esc(l.text)}\n`).join("")}</pre>`;
  if (x.kind === "table") return `<table><tr><th>row</th>${x.header.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>${x.rows.map((r) => `<tr class="${r.n === x.hit_row ? "hit" : ""}"><td>${r.n}</td>${r.cells.map((c, i) => `<td class="${r.n === x.hit_row && i === x.hit_col ? "hit" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  if (x.kind === "page") return `<div class="muted" style="margin:6px 9px">page ${x.page} of ${x.pages}</div>` + x.blocks.map((b) => `<p class="${b.n === x.hit ? "hit" : ""}">${b.n === x.hit ? mark(b.text, quote) : esc(b.text)}</p>`).join("");
  if (x.kind === "json") return `<pre>${mark(x.text, quote)}</pre>`;
  if (x.kind === "image") { const [w, h] = x.size || [800, 600], [x0, y0, x1, y1] = x.box; return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;display:block"><image href="${esc(x.url)}" width="${w}" height="${h}"/><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="rgba(240,190,60,.25)" stroke="#d9a520" stroke-width="3" rx="4"/></svg>`; }
  return `<pre>${esc(x.message || "")}</pre>`;
}
async function openFact(id) {
  const why = await (await fetch("/api/why?fact=" + encodeURIComponent(id))).json();
  const it = why.items[0];
  const top = why.items.map((i) => `<div style="margin:8px 0">${linkify(i.subject)} <b>${esc(i.predicate)}</b> ${linkify(String(i.value ?? ""))}${i.unit ? " " + esc(i.unit) : ""} <span class="tag ${esc(i.kind)}">${esc(i.kind)}</span>${i.relation ? ` <span class="muted">${esc(i.relation)}</span>` : ""}</div>`).join("") + (why.gaps || []).map((g) => `<div class="muted">! ${esc(g)}</div>`).join("");
  openDrawer(it ? `${it.subject} · ${it.predicate}` : id, Object.values(why.sources), top);
}
function showEvidence(x) {
  const top = `<div style="margin:8px 0">${linkify(x.subject || x.fact)} <b>${esc(x.predicate || "")}</b> ${linkify(String(x.value ?? ""))} ${x.kind ? `<span class="tag ${esc(x.kind)}">${esc(x.kind)}</span>` : ""}</div>${x.logged === false ? `<div class="muted">a finding computed when Claude was asked</div>` : ""}`;
  openDrawer(x.subject ? `${x.subject} · ${x.predicate}` : x.fact, x.cites, top);
}
$("d-close").onclick = () => $("drawer").classList.remove("open");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("drawer").classList.remove("open"); if (e.key === "Enter" && (e.target.id === "apikey" || e.target.id === "chatkey")) engineCall("key"); });

// ---- clicks ----------------------------------------------------------------------------------
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-focus-ask],[data-ovtab],[data-theme-set],[data-focus],[data-view],[data-view-go],[data-thing],[data-node],[data-group],[data-fact],[data-finding],[data-src-file],[data-ask],[data-engine],[data-imp],[data-ev],[data-show-graph]");
  if (!t) {
    if (e.target.closest("#gsvg") && (state.sel || state.focus)) { state.sel = null; state.focus = null; drawGraph(); glide(full); }
    return;
  }
  e.preventDefault();
  const d = t.dataset;
  if (d.focusAsk) $("ask").focus();
  else if (d.ovtab) { ovTab = d.ovtab; if (view !== "overview") show("overview"); else drawOverview(); }
  else if (d.themeSet) setTheme(d.themeSet);
  else if (d.focus) focusOn(+d.focus);
  else if (d.view) show(d.view);
  else if (d.viewGo) show(d.viewGo);
  else if (d.showGraph) { state.sel = d.showGraph; state.hidden.delete(groupOf(typeOf(d.showGraph))); show("graph"); }
  else if (d.node) { state.sel = state.sel === d.node && !t.classList.contains("chip") ? null : d.node; state.hidden.delete(groupOf(typeOf(d.node))); drawGraph(); }
  else if (d.thing) { $("drawer").classList.remove("open"); openThing(d.thing); }
  else if (d.group) { state.hidden.has(d.group) ? state.hidden.delete(d.group) : state.hidden.add(d.group); drawGraph(); }
  else if (d.srcFile) openDrawer(`${d.srcFile.split("/").pop()} · ${d.srcLoc}`, [{ file: d.srcFile, locator: d.srcLoc, quote: d.srcQuote || "" }]);
  else if (d.finding) { const it = window._findings.items[+d.finding]; openDrawer(it.value.split(":")[0], it.cite.map((k) => window._findings.sources[k]), `<div style="margin:8px 0">${linkify(it.value)}</div>`); }
  else if (d.fact) openFact(d.fact);
  else if (d.ask) ask(d.ask);
  else if (d.engine) engineCall(d.engine);
  else if (d.imp) { t.setAttribute("disabled", ""); const res = await post(`/api/improvements/${d.imp}`, { id: d.id }); impError = res.ok ? "" : (await res.json()).error; refresh(true); }
  else if (d.ev) { const [i, j] = d.ev.split(":").map(Number); showEvidence(dash.run.items[i].evidence[j]); }
});
$("q").addEventListener("input", drawThings);
document.addEventListener("keydown", (e) => { if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("q").focus(); } });
$("qtype").addEventListener("change", drawThings);

refresh(true).then(() => { connect(); if (location.hash.startsWith("#thing=")) openThing(decodeURIComponent(location.hash.slice(7))); });
</script>
</body>
