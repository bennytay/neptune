<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neptune</title>
<style>
:root { color-scheme: light dark;
  --bg: #fbfbfa; --pane: #f4f4f2; --ink: #17181a; --muted: #6e7176; --faint: #a3a6ab; --line: #e3e3df;
  --hover: #ebebe7; --accent: #2f6fdb; --sel: rgba(47,111,219,.12);
  --ok: #3f9a6b; --warn: #c58a2b; --fault: #d1584c; --idle: #5d86c7; --stale: #9a9ea4;
  --g-place: #9aa6b4; --g-asset: #17181a; --g-people: #8a6fc9; --g-work: #c58a2b; --g-docs: #3d9a97;
  --g-mission: #3f9a6b; --g-improve: #2f6fdb;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e0f11; --pane: #131416; --ink: #e8e9eb; --muted: #8b8f96; --faint: #5c6066; --line: #23252a;
  --hover: #1b1d21; --accent: #6b9cf0; --sel: rgba(107,156,240,.14);
  --ok: #5fb98a; --warn: #d9a54d; --fault: #e2766a; --idle: #7fa3dc; --stale: #6f747b;
  --g-place: #5f6b78; --g-asset: #e8e9eb; --g-people: #a68ee0; --g-work: #d9a54d; --g-docs: #5cb8b4;
  --g-mission: #5fb98a; --g-improve: #6b9cf0;
} }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; }
.lbl { font: 500 10.5px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--muted); } .faint { color: var(--faint); }

header { height: 44px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); }
header .brand { font-weight: 600; letter-spacing: -.01em; }
header .sep { width: 1px; height: 16px; background: var(--line); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--stale); flex: none; }
.dot.on, .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.fault { background: var(--fault); }
.dot.idle { background: var(--idle); } .dot.stale, .dot.unknown { background: transparent; border: 1px solid var(--stale); }
.dot.none { background: transparent; border: 1px solid var(--line); }
header .hright { margin-left: auto; display: flex; gap: 14px; align-items: center; flex: none; white-space: nowrap; }
header a.lbl { text-decoration: none; } header a.lbl:hover { color: var(--ink); }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr) 380px; }
.pane { min-height: 0; overflow: auto; }
.left { border-right: 1px solid var(--line); background: var(--pane); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.right { border-left: 1px solid var(--line); background: var(--pane); display: flex; flex-direction: column; overflow: hidden; }
.center { position: relative; }

.nav { display: flex; flex-direction: column; gap: 1px; margin: 6px 0 14px; }
.nav button { all: unset; cursor: pointer; padding: 6px 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
.nav button:hover { background: var(--hover); } .nav button.on { background: var(--sel); color: var(--accent); }
.nav .n { font: 11px var(--mono); color: var(--muted); }
.search { display: flex; gap: 6px; margin: 6px 0; }
.search input, .search select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none; }
.search select { width: 92px; font-size: 12px; }
.search input:focus, .chatbox textarea:focus, .key input:focus { border-color: var(--accent); }
.things { flex: 1; overflow: auto; margin: 0 -4px; }
.thing { all: unset; display: grid; grid-template-columns: 10px 1fr; column-gap: 8px; align-items: center; width: calc(100% - 8px); padding: 6px 8px; margin: 0 4px; border-radius: 6px; cursor: pointer; box-sizing: border-box; }
.thing:hover { background: var(--hover); } .thing.on { background: var(--sel); }
.thing .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thing .id { grid-column: 2; font: 10.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.view { padding: 22px 28px 40px; max-width: 1100px; }
.view[hidden], [hidden] { display: none !important; }
.view h1 { font-size: 20px; font-weight: 600; letter-spacing: -.015em; margin: 4px 0 2px; }
.sub { color: var(--muted); margin-bottom: 22px; }
.block { margin: 26px 0 0; } .block > .lbl { display: flex; justify-content: space-between; margin-bottom: 8px; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; }
.stat { padding: 12px 14px; border-left: 1px solid var(--line); } .stat:first-child { border-left: 0; }
.stat .v { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat.alert .v { color: var(--warn); }
.rows { border-top: 1px solid var(--line); }
.r { display: flex; gap: 12px; align-items: baseline; padding: 8px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
.r:hover { background: var(--hover); }
.r .t { font: 11px var(--mono); color: var(--faint); min-width: 64px; flex: none; }
.r .k { font: 10.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; min-width: 82px; flex: none; }
.r .x { flex: 1; min-width: 0; }
.r .e { color: var(--muted); font-size: 12px; flex: none; }
.tag { font: 10px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
.tag.inferred { border-style: dashed; } .tag.stale, .tag.unknown { color: var(--warn); } .tag.fault { color: var(--fault); border-color: var(--fault); }
.tag.up { color: var(--ok); } .tag.down { color: var(--warn); } .tag.new { color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th { text-align: left; font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--mono); font-size: 12px; }
.cite { font: 11px var(--mono); color: var(--muted); text-decoration: none; border-bottom: 1px dotted var(--faint); cursor: pointer; }
.cite:hover { color: var(--accent); border-color: var(--accent); }
.ref { color: var(--accent); cursor: pointer; text-decoration: none; }
.ref:hover { text-decoration: underline; }

/* graph */
#v-graph { padding: 0; max-width: none; position: absolute; inset: 0; }
#gsvg { width: 100%; height: 100%; display: block; cursor: grab; }
#gsvg.drag { cursor: grabbing; }
.gbar { position: absolute; top: 14px; left: 18px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; z-index: 2; }
.gbar button { all: unset; cursor: pointer; font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; padding: 3px 7px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: var(--bg); display: inline-flex; gap: 6px; align-items: center; }
.gbar button.off { opacity: .4; } .gbar button i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.gcard { position: absolute; left: 18px; right: 18px; bottom: 18px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; z-index: 2; max-height: 42%; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
.gcard .hd { display: flex; gap: 10px; align-items: baseline; }
.gcard .hd b { font-size: 14px; font-weight: 600; }
svg text { font-family: system-ui, sans-serif; }
.edge { stroke: var(--line); stroke-width: 1; }
.edge.hi { stroke: var(--accent); stroke-width: 1.4; }
.edge.dim, .node.dim { opacity: .14; }
.node { cursor: pointer; } .node text { font-size: var(--fs, 11px); fill: var(--muted); pointer-events: none; }
.edge { stroke-width: calc(var(--sw, 1) * 1px); } .edge.hi { stroke-width: calc(var(--sw, 1) * 1.6px); }
.node.hi text, .node.sel text { fill: var(--ink); font-weight: 500; }

/* lanes */
.lanes { position: relative; margin-top: 4px; }
.lane { display: grid; grid-template-columns: 96px 1fr; align-items: center; height: 30px; border-bottom: 1px solid var(--line); }
.lane .p { font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.lane .bar { position: relative; height: 22px; }
.span { position: absolute; top: 2px; height: 18px; border-radius: 3px; font: 10.5px var(--mono); color: #fff; padding: 0 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 18px; cursor: pointer; opacity: .9; }
.span:hover { opacity: 1; outline: 1px solid var(--ink); }
.axis { display: grid; grid-template-columns: 96px 1fr; height: 18px; }
.axis .ticks { position: relative; font: 10px var(--mono); color: var(--faint); }
.axis .ticks span { position: absolute; transform: translateX(-50%); }

/* improvements */
.key { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.key input { flex: 1; min-width: 180px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; outline: none; }
.btn { all: unset; cursor: pointer; font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); white-space: nowrap; }
.btn:hover { border-color: var(--ink); } .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.imp { border-top: 1px solid var(--line); padding: 14px 0; }
.imp .hd { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.imp .rk { font: 12px var(--mono); color: var(--faint); width: 18px; }
.imp .tt { font-size: 14px; font-weight: 600; flex: 1; min-width: 200px; cursor: pointer; }
.imp dl { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; margin: 10px 0 0 28px; }
.imp dt { font: 10.5px/1.9 var(--mono); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.imp dd { margin: 0; }
.imp .acts { margin: 10px 0 0 28px; display: flex; gap: 6px; }
.ck { display: block; } .ck b { font-weight: 500; } .ck.respects b { color: var(--ok); } .ck.breaks b { color: var(--fault); } .ck.unclear b { color: var(--muted); }
.chip { display: inline-block; font: 11px var(--mono); padding: 1px 6px; margin: 0 4px 3px 0; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; color: var(--muted); }
.chip:hover { color: var(--accent); border-color: var(--accent); }
.cov { font: 11px var(--mono); }
.bar-s { display: inline-block; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 6px; background: var(--faint); }

/* chat */
.chead { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.msgs { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.u { align-self: flex-end; max-width: 88%; background: var(--hover); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; white-space: pre-wrap; }
.a { line-height: 1.6; } .a p { margin: 0 0 8px; } .a ul { margin: 0 0 8px; padding-left: 18px; }
.trace { margin-bottom: 6px; } .trace summary { cursor: pointer; list-style: none; } .trace summary::-webkit-details-marker { display: none; }
.trace .st { font: 11px/1.45 var(--mono); color: var(--muted); border-left: 1px solid var(--line); margin: 6px 0 0 3px; padding: 2px 0 2px 10px; white-space: pre-wrap; word-break: break-word; }
.trace .st b { color: var(--ink); font-weight: 500; }
.sugs { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.sugs button { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--bg); }
.sugs button:hover { border-color: var(--accent); }
.chatbox { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: flex; gap: 8px; align-items: flex-end; }
.chatbox textarea { flex: 1; resize: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 38px; max-height: 140px; outline: none; }
.thinking { color: var(--muted); font: 11px var(--mono); }
.thinking::after { content: "…"; animation: blink 1.2s infinite; } @keyframes blink { 50% { opacity: .2; } }

/* source drawer */
#drawer { position: fixed; top: 44px; bottom: 0; right: 380px; width: min(560px, 60vw); background: var(--bg); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.08); padding: 16px 18px; overflow: auto; transform: translateX(110%); transition: transform .16s ease; z-index: 5; }
#drawer:not(.open) { visibility: hidden; pointer-events: none; transition: transform .16s ease, visibility 0s .16s; }
#drawer.open { transform: none; }
.src { border: 1px solid var(--line); border-radius: 8px; margin: 10px 0; overflow: hidden; }
.src .head { padding: 6px 9px; border-bottom: 1px solid var(--line); font: 11px var(--mono); color: var(--muted); }
.src .body { max-height: 300px; overflow: auto; }
.src pre { margin: 0; padding: 8px 9px; font: 11.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; }
.src .ln { color: var(--faint); display: inline-block; min-width: 3.5em; user-select: none; }
.src .hitline, .src tr.hit td, .src p.hit { background: var(--sel); }
.src p { margin: 4px 8px; padding: 3px 6px; border-radius: 4px; }
.src td.hit { background: rgba(240,190,60,.35); }
mark { background: rgba(240,190,60,.4); color: inherit; border-radius: 2px; }
@media (max-width: 1000px) { .app { grid-template-columns: minmax(0, 1fr); overflow: auto; } .left, .right { display: none; } #drawer { right: 0; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<header>
  <span class="brand">neptune</span><span class="sep"></span>
  <span id="site">—</span>
  <span class="lbl" style="display:flex;gap:7px;align-items:center"><span class="dot" id="livedot"></span><span id="clock">connecting</span></span>
  <div class="hright"><span class="lbl" id="seq"></span><a class="lbl" href="/classic">classic view</a></div>
</header>
<div class="app">
  <aside class="pane left">
    <div class="lbl">Views</div>
    <nav class="nav" id="nav">
      <button data-view="overview" class="on">Overview</button>
      <button data-view="graph">Graph <span class="n" id="n-graph"></span></button>
      <button data-view="improvements">Improvements <span class="n" id="n-imp"></span></button>
      <button data-view="sources">Sources <span class="n" id="n-src"></span></button>
    </nav>
    <div class="lbl" style="display:flex;justify-content:space-between">Things <span id="n-things"></span></div>
    <div class="search"><input id="q" placeholder="Filter" autocomplete="off"><select id="qtype"><option value="">all</option></select></div>
    <div class="things" id="things"></div>
  </aside>

  <main class="pane center" id="center">
    <section class="view" id="v-overview"></section>
    <section class="view" id="v-graph" hidden>
      <div class="gbar" id="gbar"></div>
      <svg id="gsvg"></svg>
      <div class="gcard" id="gcard" hidden></div>
    </section>
    <section class="view" id="v-thing" hidden></section>
    <section class="view" id="v-improvements" hidden></section>
    <section class="view" id="v-sources" hidden></section>
  </main>

  <aside class="right">
    <div class="chead"><span class="lbl">Ask · <span id="chat-site"></span></span><button class="btn" id="clear" title="Start a new conversation">Clear</button></div>
    <div class="msgs" id="msgs"></div>
    <div class="chatbox"><textarea id="ask" rows="1" placeholder="Ask about the site…"></textarea><button class="btn primary" id="send">Ask</button></div>
  </aside>
</div>
<aside id="drawer"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="lbl" id="d-title"></span><button class="btn" id="d-close">Close</button></div><div id="d-body"></div></aside>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const unesc = (s) => String(s).replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
const short = (ref) => String(ref ?? "").split(":").slice(1).join(":") || ref;
const typeOf = (ref) => String(ref ?? "").split(":")[0];
const clock = (t) => (t ? String(t).replace("T", " ") : "");
const hms = (t, day) => (t && day && String(t).startsWith(day) ? String(t).slice(11, 19) : clock(t));
const secs = (t) => Date.parse(t + "Z") / 1000;
const post = (url, body) => fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
const GROUPS = {
  place: ["site", "area", "cell", "zone"], asset: ["robot", "machine"], people: ["person", "role", "qualification", "shift"],
  work: ["task", "work_order", "change"], docs: ["document", "rule"], mission: ["goal", "constraint"], improve: ["improvement"],
};
const GROUP_NAME = { place: "places", asset: "robots & machines", people: "people", work: "work", docs: "documents", mission: "mission", improve: "improvements" };
const groupOf = (t) => Object.keys(GROUPS).find((g) => GROUPS[g].includes(t)) || "work";
let dash = null, graphData = null, view = "overview", current = null, head = null;
const state = { hidden: new Set(["work"]), sel: null };

// ---- data ------------------------------------------------------------------------------------
let busy = false, dirty = false, last = 0;
async function refresh(force) {
  if (busy) { dirty = true; return; }
  const wait = force ? 0 : 1500 - (Date.now() - last);
  if (wait > 0) { dirty = true; setTimeout(() => { if (dirty) { dirty = false; refresh(true); } }, wait); return; }
  busy = true;
  try {
    const [d, g] = await Promise.all([fetch("/api/dashboard").then((r) => r.json()), fetch("/api/graph").then((r) => r.json())]);
    const grew = !graphData || g.nodes.length !== graphData.nodes.length || g.edges.length !== graphData.edges.length;
    dash = d; graphData = g; last = Date.now();
    if (grew) layout();
    render();
  } finally {
    busy = false;
    if (dirty) { dirty = false; refresh(); }
  }
}
function connect() {
  const events = new EventSource("/events");
  events.onmessage = (e) => { head = JSON.parse(e.data); $("livedot").classList.add("on"); refresh(); };
  events.onerror = () => { $("livedot").classList.remove("on"); $("clock").textContent = "reconnecting"; };
}

// ---- shell -----------------------------------------------------------------------------------
function render() {
  const name = dash.site.name || dash.site.id || "site";
  document.title = `${name} · Neptune`;
  $("site").textContent = name; $("chat-site").textContent = name;
  $("clock").textContent = `live · ${clock(dash.at)}`;
  $("seq").textContent = `seq ${head ? head.seq : dash.seq}`;
  $("n-graph").textContent = graphData.nodes.length;
  $("n-imp").textContent = dash.run ? dash.counts.improvements : "";
  $("n-src").textContent = dash.counts.stale_sources ? `${dash.counts.stale_sources} stale` : dash.counts.sources;
  drawThings();
  if (view === "overview") drawOverview();
  if (view === "graph") drawGraph();
  if (view === "improvements") drawImprovements();
  if (view === "sources") drawSources();
  if (view === "thing" && current) openThing(current, true);
  if (!$("msgs").children.length) drawChatIntro();
}
function show(name) {
  view = name;
  for (const b of document.querySelectorAll("#nav button")) b.classList.toggle("on", b.dataset.view === name);
  for (const v of ["overview", "graph", "thing", "improvements", "sources"]) $("v-" + v).hidden = v !== name;
  if (dash) render();
}
function drawThings() {
  const q = $("q").value.trim().toLowerCase(), t = $("qtype").value;
  const types = [...new Set(graphData.nodes.map((n) => n.type))].sort();
  if ($("qtype").options.length !== types.length + 1) $("qtype").innerHTML = `<option value="">all</option>` + types.map((x) => `<option>${x}</option>`).join("");
  $("qtype").value = t;
  const order = ["robot", "machine", "cell", "person", "zone", "area"];
  const nodes = graphData.nodes.filter((n) => (!t || n.type === t) && (!q || (n.name + " " + n.id).toLowerCase().includes(q)))
    .filter((n) => t || q || order.includes(n.type))
    .sort((a, b) => (order.indexOf(a.type) + 99) % 99 - (order.indexOf(b.type) + 99) % 99 || a.id.localeCompare(b.id));
  $("n-things").textContent = nodes.length;
  $("things").innerHTML = nodes.map((n) => `<button class="thing ${current === n.id ? "on" : ""}" data-thing="${esc(n.id)}"><span class="dot ${esc(n.status || "none")}"></span><span class="nm">${esc(n.name)}</span><span class="id">${esc(n.id)}</span></button>`).join("");
}

// ---- overview --------------------------------------------------------------------------------
function drawOverview() {
  const d = dash, c = d.counts, day = (d.at || "").slice(0, 10), k = c.kinds;
  const stat = (v, l, alert) => `<div class="stat ${alert ? "alert" : ""}"><div class="lbl">${l}</div><div class="v">${v}</div></div>`;
  const goals = d.mission.goals.map((g) => `<div class="r" data-fact="${esc(g.facts[0])}"><span class="k">goal</span><span class="x">${esc(g.name)}</span><span class="e mono">${esc(g.target || "")}</span></div>`).join("")

// ---- graph -----------------------------------------------------------------------------------
let pos = {}, vb = null;
function layout() {
  const nodes = graphData.nodes, edges = graphData.edges, n = nodes.length;
  const keys = Object.keys(GROUPS);
  let seed = 7; const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const p = {};
  nodes.forEach((nd) => {
    const old = pos[nd.id];
    const a = (keys.indexOf(groupOf(nd.type)) / keys.length) * Math.PI * 2 + rand() * 0.8;
    p[nd.id] = old ? { ...old } : { x: Math.cos(a) * 260 + rand() * 40, y: Math.sin(a) * 260 + rand() * 40 };
  });
  const idx = nodes.map((nd) => p[nd.id]);
  const links = edges.map((e) => [p[e.from], p[e.to]]).filter(([a, b]) => a && b);
  const N = 420;
  for (let it = 0; it < N; it++) {
    const cool = 1 - it / N;
    for (let i = 0; i < n; i++) {
      const a = idx[i];
      a.vx = (a.vx || 0) * 0.55 - a.x * 0.0022; a.vy = (a.vy || 0) * 0.55 - a.y * 0.0022;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const b = idx[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 1, d = Math.sqrt(d2);
        let f = 3200 / d2;
        if (d < 34) f += (34 - d) * 0.6 / d;  // keep nodes and their labels apart
        a.vx += dx / d * f; a.vy += dy / d * f;
      }
    }
    for (const [a, b] of links) {
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, f = (d - 78) * 0.03;
      a.vx += dx / d * f; a.vy += dy / d * f; b.vx -= dx / d * f; b.vy -= dy / d * f;
    }
    for (const a of idx) { a.x += Math.max(-24, Math.min(24, a.vx)) * cool; a.y += Math.max(-24, Math.min(24, a.vy)) * cool; }
  }
  pos = p;
  const xs = idx.map((a) => a.x), ys = idx.map((a) => a.y), pad = 60;
  vb = { x: Math.min(...xs) - pad, y: Math.min(...ys) - pad, w: Math.max(...xs) - Math.min(...xs) + pad * 2, h: Math.max(...ys) - Math.min(...ys) + pad * 2 };
}
function drawGraph() {
  $("gbar").innerHTML = `<span class="lbl" style="margin-right:4px">Graph</span>` + Object.keys(GROUPS).map((g) =>
    `<button data-group="${g}" class="${state.hidden.has(g) ? "off" : ""}"><i style="background:var(--g-${g})"></i>${GROUP_NAME[g]}</button>`).join("");
  const visible = (nd) => !state.hidden.has(groupOf(nd.type));
  const nodes = graphData.nodes.filter(visible), ids = new Set(nodes.map((nd) => nd.id));
  const edges = graphData.edges.filter((e) => ids.has(e.from) && ids.has(e.to));
  const sel = state.sel, near = new Set(sel ? [sel] : []);
  if (sel) for (const e of edges) { if (e.from === sel) near.add(e.to); if (e.to === sel) near.add(e.from); }
  const color = (nd) => nd.status && nd.status !== "ok" ? `var(--${nd.status === "unknown" ? "stale" : nd.status})` : `var(--g-${groupOf(nd.type)})`;
  let out = "";
  for (const e of edges) {
    const a = pos[e.from], b = pos[e.to];
    const cls = sel ? (e.from === sel || e.to === sel ? "hi" : "dim") : "";
    out += `<line class="edge ${cls}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${esc(e.from)} ${esc(e.predicate)} ${esc(e.to)}</title></line>`;
  }
  for (const nd of nodes) {
    const a = pos[nd.id], r = 3.5 + Math.min(8, Math.sqrt(nd.degree) * 1.6);
    const cls = sel ? (nd.id === sel ? "sel" : near.has(nd.id) ? "hi" : "dim") : "";
    const label = nd.degree >= 4 || (sel && near.has(nd.id)) || nd.type === "improvement" || ["robot", "machine"].includes(nd.type);
    const ring = nd.status === "stale" || nd.status === "unknown" ? `fill="var(--bg)" stroke="${color(nd)}" stroke-width="1.5"` : `fill="${color(nd)}"`;
    out += `<g class="node ${cls}" data-node="${esc(nd.id)}"><circle cx="${a.x}" cy="${a.y}" r="${r + 8}" fill="transparent"/><circle cx="${a.x}" cy="${a.y}" r="${r}" ${ring}/>${nd.id === sel ? `<circle cx="${a.x}" cy="${a.y}" r="${r + 4}" fill="none" stroke="var(--accent)"/>` : ""}${label ? `<text x="${a.x + r + 4}" y="${a.y + 3.5}">${esc(nd.name.length > 28 ? nd.name.slice(0, 27) + "…" : nd.name)}</text>` : ""}<title>${esc(nd.id)}</title></g>`;
  }
  const svg = $("gsvg");
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  svg.innerHTML = out;
  scaleLabels();
  drawGraphCard();
}
async function drawGraphCard() {
  const card = $("gcard");
  if (!state.sel) { card.hidden = true; return; }
  const t = await (await fetch("/api/thing?id=" + encodeURIComponent(state.sel))).json();
  card.hidden = false;
  const now = t.now.filter((x) => x.value != null).slice(0, 6).map((x) => `<span class="muted">${esc(x.predicate)}</span> ${esc(x.value)}${x.unit ? " " + esc(x.unit) : ""}`).join(" · ");
  card.innerHTML = `<div class="hd"><span class="dot ${esc(t.status || "none")}"></span><b>${esc(t.name)}</b><span class="mono muted">${esc(t.id)}</span><span style="margin-left:auto;display:flex;gap:6px"><button class="btn" data-thing="${esc(t.id)}">Open</button><button class="btn" data-ask="Tell me about ${esc(t.id)}">Ask</button></span></div>
    <div style="margin-top:6px">${now || `<span class="muted">${t.links.length} links</span>`}</div>

    <div style="margin-top:8px">${t.links.slice(0, 14).map((l) => `<span class="chip" data-node="${esc(l.other)}">${esc(l.dir === "out" ? l.predicate + " → " : "← " + l.predicate + " ")}${esc(short(l.other))}</span>`).join("")}</div>`;

function scaleLabels() {  // labels stay ~11 px on screen at any zoom
  const svg = $("gsvg"), r = svg.getBoundingClientRect();
  if (!vb || !r.width) return;
  const k = Math.max(vb.w / r.width, vb.h / r.height);
  svg.style.setProperty("--fs", `${11 * k}px`);
  svg.style.setProperty("--sw", `${k}`);
}
(function panZoom() {
  const svg = $("gsvg");
  let drag = null;
  svg.addEventListener("wheel", (e) => {
    if (!vb) return; e.preventDefault();
    const k = e.deltaY > 0 ? 1.12 : 0.89, r = svg.getBoundingClientRect();
    const mx = vb.x + (e.clientX - r.left) / r.width * vb.w, my = vb.y + (e.clientY - r.top) / r.height * vb.h;
    vb = { x: mx - (mx - vb.x) * k, y: my - (my - vb.y) * k, w: vb.w * k, h: vb.h * k };
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    scaleLabels();
  }, { passive: false });
  svg.addEventListener("mousedown", (e) => { if (!e.target.closest("[data-node]")) { drag = { x: e.clientX, y: e.clientY, vb: { ...vb } }; svg.classList.add("drag"); } });
  window.addEventListener("mousemove", (e) => {
    if (!drag) return;
    const r = svg.getBoundingClientRect(), s = Math.max(vb.w / r.width, vb.h / r.height);
    vb = { ...drag.vb, x: drag.vb.x - (e.clientX - drag.x) * s, y: drag.vb.y - (e.clientY - drag.y) * s };
    svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  });
  window.addEventListener("mouseup", () => { drag = null; svg.classList.remove("drag"); });
})();

const tick = (t, day) => (t.startsWith(day) ? t.slice(11, 16) : t.slice(5, 16).replace("T", " "));

async function openThing(id, quiet) {

  const x = (s) => (start && end && end > start ? Math.max(0, Math.min(100, (secs(s) - start) / (end - start) * 100)) : 0);
  const tone = (p, v) => /fault|error|stop|jam|protective/i.test(v) && !/^ok$/i.test(v) ? "var(--fault)" : /starv|wait|idle|pause|block|break/i.test(v) ? "var(--warn)" : p === "in_zone" || p === "current_task" || p === "on_shift" ? "var(--idle)" : /running|auto|ok/i.test(v) ? "var(--ok)" : "var(--stale)";

      return `<div class="span" data-fact="${esc(s.fact)}" style="left:${a}%;width:${Math.max(0.4, b - a)}%;background:${tone(l.predicate, s.value)}" title="${esc(`${l.predicate} = ${s.value} · ${clock(s.start)} → ${s.end ? clock(s.end) : "now"} · ${s.kind}`)}">${esc(v)}</div>`;

  }

    <div class="lbl">${esc(t.type)}</div>
    <h1 style="display:flex;gap:10px;align-items:center"><span class="dot ${esc(t.status || "none")}"></span>${esc(t.name)}</h1>
    <div class="sub mono">${esc(t.id)}${t.same_as.length ? " · same as " + t.same_as.map(esc).join(", ") : ""} · <a class="ref" data-show-graph="${esc(t.id)}">show in graph</a> · <a class="ref" data-ask="Tell me about ${esc(t.id)}">ask about it</a></div>
    ${lanes ? `<div class="block"><div class="lbl"><span>Timeline</span><span>${esc(hms(t.start, day))} → ${esc(hms(t.at, day))}</span></div><div class="lanes">${lanes}</div></div>` : ""}
    ${t.findings.length ? `<div class="block"><div class="lbl"><span>Findings</span><span>inferred</span></div><div class="rows">${t.findings.map((f) => `<div class="r"><span class="t">${esc(hms(f.valid_from, day))}</span><span class="x">${esc(f.text)} ${f.cites.slice(0, 3).map(citeLink).join(" ")}</span></div>`).join("")}</div></div>` : ""}
    ${t.improvements.length ? `<div class="block"><div class="lbl">Improvements citing it</div><div class="rows">${t.improvements.map((i) => `<div class="r" data-view-go="improvements"><span class="t">#${i.rank}</span><span class="x">${esc(i.title)}</span></div>`).join("")}</div></div>` : ""}

async function engineCall(verb) {
  impError = "";
  if (verb === "key") {
    const input = $("apikey") || $("chatkey"), key = input.value.trim();
    if (!key) return;
    input.value = "";
    await post("/api/engine/key", { key });
  } else if (verb === "forget") await post("/api/engine/key", { key: "" });
  else if (verb === "auto") await post("/api/engine/auto", { on: !dash.engine.auto });
  else { const res = await post(`/api/engine/${verb}`, {}); if (!res.ok) impError = (await res.json()).error; }
  document.activeElement && document.activeElement.blur();
  await refresh(true);
  if (!$("msgs").querySelector(".u")) drawChatIntro();
}

    <table><tr><th>source</th><th>kind</th><th>facts</th><th>latest</th><th>state</th></tr>${d.sources.map((s) => `<tr><td>${esc(s.name)}</td><td class="muted">${esc(s.kind)}</td><td class="num"><span class="bar-s" style="width:${Math.max(2, s.facts / max * 80)}px"></span>${s.facts}</td><td class="num muted">${esc(hms(s.last_seen || s.latest, day))}</td><td>${s.state === "stale" ? `<span class="tag stale">stale</span> <span class="muted">${esc(s.note)}</span>` : s.kind === "feed" ? `<span class="muted">fresh</span>` : ""}</td></tr>`).join("")}</table>
    <div class="block"><div class="lbl"><span>Coverage</span><span>facts about each thing, by evidence</span></div>
    <table class="cov"><tr><th>thing</th>${cls.map((x) => `<th>${x === "feed" ? "live feed" : x}</th>`).join("")}<th>gaps</th></tr>${d.coverage.map((r) => `<tr><td><a class="ref" data-thing="${esc(r.id)}">${esc(r.id)}</a></td>${cls.map((x) => `<td>${r.counts[x] ? `<span class="bar-s" style="width:${Math.min(60, 4 + Math.log2(1 + r.counts[x]) * 7)}px;background:var(--g-${x === "feed" ? "mission" : x === "records" ? "improve" : x === "documents" ? "docs" : "people"})"></span>${r.counts[x]}` : `<span class="faint">·</span>`}</td>`).join("")}<td class="muted">${[r.stale.length ? "stale: " + r.stale.join(", ") : "", r.unknown.length ? "unknown: " + r.unknown.join(", ") : ""].filter(Boolean).map(esc).join(" · ")}</td></tr>`).join("")}</table></div>`;
}

// ---- chat ------------------------------------------------------------------------------------
const talk = "t" + Date.now().toString(36);
function drawChatIntro() {
  const has = dash && dash.engine.key;
  $("msgs").innerHTML = `<div class="muted">Ask anything about ${esc(dash ? dash.site.name : "the site")}. Claude answers from the cited model and shows each step it took.</div>
    ${has ? "" : `<div class="key"><input type="password" id="chatkey" placeholder="Your Anthropic API key" autocomplete="off"><button class="btn primary" data-engine="key">Use key</button></div><div class="faint" style="font-size:12px">Kept in this server's memory only.</div>`}
    <div class="sugs">${["What is going on right now?", "What held up Cell C3 today, and why?", "Who can reset Arm C3 right now?", "What don't we know about the AMR fleet?"].map((q) => `<button data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
}
const CITE = /((?:static|feed|improvements|actions|\.neptune)\/[^\s()]+?) (line \d+|row \d+ col &quot;[^&]*?&quot;|page \d+ block \d+|region [\d,]+|json \/[^\s)]*)|\b((?:robot|machine|cell|zone|area|person|goal|constraint|improvement|work_order|change|rule|document|task|qualification|role|shift|site):[A-Za-z0-9_.\-]*[A-Za-z0-9])|\b(fact:[0-9a-f]{16})\b/g;
function linkify(text) {
  return esc(text).replace(CITE, (m, file, loc, ent, fact) => {
    if (file) return `<a class="cite" data-src-file="${esc(unesc(file))}" data-src-loc="${esc(unesc(loc))}">${m}</a>`;
    if (ent) return `<a class="ref" data-thing="${ent}">${ent}</a>`;
    return `<a class="cite" data-fact="${fact}">${fact.slice(0, 13)}…</a>`;
  });
}
function prose(text) {
  const out = [];
  let list = null;
  for (const raw of String(text).split("\n")) {
    const line = linkify(raw).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, '<span class="mono">$1</span>');
    if (/^\s*[-*] /.test(raw)) { (list ||= []).push(`<li>${line.replace(/^\s*[-*] /, "")}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (raw.trim()) out.push(`<p>${line.replace(/^#+\s*/, "")}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}
let asking = false;
async function ask(text) {
  text = text.trim();
  if (!text || asking) return;
  if (!$("msgs").querySelector(".u")) $("msgs").innerHTML = "";
  asking = true; $("send").setAttribute("disabled", "");
  $("msgs").insertAdjacentHTML("beforeend", `<div class="u">${esc(text)}</div><div class="a"><span class="thinking">reading the site model</span></div>`);
  const slot = $("msgs").lastElementChild;
  $("msgs").scrollTop = $("msgs").scrollHeight;
  try {
    const res = await post("/api/chat", { id: talk, text });
    const r = await res.json();
    if (!res.ok) { slot.innerHTML = `<span style="color:var(--fault)" class="mono">${esc(r.error)}</span>`; return; }
    const trace = r.trace.length ? `<details class="trace"><summary class="lbl">Trace · ${r.trace.length} step${r.trace.length > 1 ? "s" : ""}</summary>${r.trace.map((s) => `<div class="st"><b>${esc(s.tool)}</b> ${esc(s.input)}${s.head ? "\n" + esc(s.head) : ""}</div>`).join("")}</details>` : "";
    slot.innerHTML = trace + prose(r.reply);
  } catch (e) {
    slot.innerHTML = `<span style="color:var(--fault)" class="mono">${esc(String(e))}</span>`;
  } finally {
    asking = false; $("send").removeAttribute("disabled");
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }
}
$("send").onclick = () => { ask($("ask").value); $("ask").value = ""; };
$("ask").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("send").click(); } });
$("ask").addEventListener("input", () => { $("ask").style.height = "auto"; $("ask").style.height = Math.min(140, $("ask").scrollHeight) + "px"; });
$("clear").onclick = async () => { await post("/api/chat/clear", { id: talk }); drawChatIntro(); };

// ---- sources drawer --------------------------------------------------------------------------
function citeLink(c) { return `<a class="cite" data-src-file="${esc(c.file)}" data-src-loc="${esc(c.locator)}" data-src-quote="${esc(c.quote || "")}">${esc(c.file.split("/").pop())} ${esc(c.locator)}</a>`; }
function mark(text, quote) {
  const t = esc(text);
  if (!quote) return t;
  const q = esc(quote), i = t.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? t : t.slice(0, i) + "<mark>" + t.slice(i, i + q.length) + "</mark>" + t.slice(i + q.length);
}
function openDrawer(title, sources, top) {
  $("d-title").textContent = title;
  $("d-body").innerHTML = (top || "") + sources.map((s, k) => `<div class="src" id="src-${k}"><div class="head">${esc(s.file)} · ${esc(s.locator)}</div><div class="body"><pre>${esc(s.quote || "")}</pre></div></div>`).join("");
  $("drawer").classList.add("open");
  sources.forEach((s, k) => fetch(`/api/source?file=${encodeURIComponent(s.file)}&locator=${encodeURIComponent(s.locator)}`).then((r) => r.json()).then((x) => {
    const el = document.querySelector(`#src-${k} .body`);
    if (!el) return;
    el.innerHTML = excerpt(x, s.quote);
    const hit = el.querySelector("tr.hit,.hitline,p.hit,mark");
    if (hit) el.scrollTop = Math.max(0, hit.offsetTop - 40);
  }));
}
function excerpt(x, quote) {
  if (x.kind === "lines") return `<pre>${x.lines.map((l) => l.n === x.hit ? `<span class="hitline"><span class="ln">${l.n}</span>${mark(l.text, quote)}</span>\n` : `<span class="ln">${l.n}</span>${esc(l.text)}\n`).join("")}</pre>`;
  if (x.kind === "table") return `<table><tr><th>row</th>${x.header.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>${x.rows.map((r) => `<tr class="${r.n === x.hit_row ? "hit" : ""}"><td>${r.n}</td>${r.cells.map((c, i) => `<td class="${r.n === x.hit_row && i === x.hit_col ? "hit" : ""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  if (x.kind === "page") return `<div class="muted" style="margin:6px 9px">page ${x.page} of ${x.pages}</div>` + x.blocks.map((b) => `<p class="${b.n === x.hit ? "hit" : ""}">${b.n === x.hit ? mark(b.text, quote) : esc(b.text)}</p>`).join("");
  if (x.kind === "json") return `<pre>${mark(x.text, quote)}</pre>`;
  if (x.kind === "image") { const [w, h] = x.size || [800, 600], [x0, y0, x1, y1] = x.box; return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;display:block"><image href="${esc(x.url)}" width="${w}" height="${h}"/><rect x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" fill="rgba(240,190,60,.25)" stroke="#d9a520" stroke-width="3" rx="4"/></svg>`; }
  return `<pre>${esc(x.message || "")}</pre>`;
}
async function openFact(id) {
  const why = await (await fetch("/api/why?fact=" + encodeURIComponent(id))).json();
  const it = why.items[0];
  const top = why.items.map((i) => `<div style="margin:8px 0">${linkify(i.subject)} <b>${esc(i.predicate)}</b> ${linkify(String(i.value ?? ""))}${i.unit ? " " + esc(i.unit) : ""} <span class="tag ${esc(i.kind)}">${esc(i.kind)}</span>${i.relation ? ` <span class="muted">${esc(i.relation)}</span>` : ""}</div>`).join("") + (why.gaps || []).map((g) => `<div class="muted">! ${esc(g)}</div>`).join("");
  openDrawer(it ? `${it.subject} · ${it.predicate}` : id, Object.values(why.sources), top);
}
function showEvidence(x) {
  const top = `<div style="margin:8px 0">${linkify(x.subject || x.fact)} <b>${esc(x.predicate || "")}</b> ${linkify(String(x.value ?? ""))} ${x.kind ? `<span class="tag ${esc(x.kind)}">${esc(x.kind)}</span>` : ""}</div>${x.logged === false ? `<div class="muted">a finding computed when Claude was asked</div>` : ""}`;
  openDrawer(x.subject ? `${x.subject} · ${x.predicate}` : x.fact, x.cites, top);
}
$("d-close").onclick = () => $("drawer").classList.remove("open");
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("drawer").classList.remove("open"); if (e.key === "Enter" && (e.target.id === "apikey" || e.target.id === "chatkey")) engineCall("key"); });

// ---- clicks ----------------------------------------------------------------------------------
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-view],[data-view-go],[data-thing],[data-node],[data-group],[data-fact],[data-finding],[data-src-file],[data-ask],[data-engine],[data-imp],[data-ev],[data-show-graph]");
  if (!t) { if (e.target.closest("#gsvg") && state.sel) { state.sel = null; drawGraph(); } return; }
  e.preventDefault();
  const d = t.dataset;
  if (d.view) show(d.view);
  else if (d.viewGo) show(d.viewGo);
  else if (d.showGraph) { state.sel = d.showGraph; state.hidden.delete(groupOf(typeOf(d.showGraph))); show("graph"); }
  else if (d.node) { state.sel = state.sel === d.node && !t.classList.contains("chip") ? null : d.node; state.hidden.delete(groupOf(typeOf(d.node))); drawGraph(); }
  else if (d.thing) { $("drawer").classList.remove("open"); openThing(d.thing); }
  else if (d.group) { state.hidden.has(d.group) ? state.hidden.delete(d.group) : state.hidden.add(d.group); drawGraph(); }
  else if (d.srcFile) openDrawer(`${d.srcFile.split("/").pop()} · ${d.srcLoc}`, [{ file: d.srcFile, locator: d.srcLoc, quote: d.srcQuote || "" }]);
  else if (d.finding) { const it = window._findings.items[+d.finding]; openDrawer(it.value.split(":")[0], it.cite.map((k) => window._findings.sources[k]), `<div style="margin:8px 0">${linkify(it.value)}</div>`); }
  else if (d.fact) openFact(d.fact);
  else if (d.ask) ask(d.ask);
  else if (d.engine) engineCall(d.engine);
  else if (d.imp) { t.setAttribute("disabled", ""); const res = await post(`/api/improvements/${d.imp}`, { id: d.id }); impError = res.ok ? "" : (await res.json()).error; refresh(true); }
  else if (d.ev) { const [i, j] = d.ev.split(":").map(Number); showEvidence(dash.run.items[i].evidence[j]); }
});
$("q").addEventListener("input", drawThings);
$("qtype").addEventListener("change", drawThings);

refresh(true).then(() => { connect(); if (location.hash.startsWith("#thing=")) openThing(decodeURIComponent(location.hash.slice(7))); });
</script>
</body>
</html>
