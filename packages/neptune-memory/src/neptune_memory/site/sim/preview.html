<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plant 7 · simulated</title>
<style>
  :root { --bg:#0f1216; --panel:#161a20; --line:#262c35; --text:#d7dce2; --muted:#7d8792;
          --ok:#5fb37a; --warn:#e0a84a; --bad:#e5604f; --info:#5aa6d6; --part:#e8913a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 ui-sans-serif,system-ui,sans-serif; }
  header { display:flex; align-items:baseline; gap:18px; padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.2px; }
  header .sub { color:var(--muted); }
  #clock { margin-left:auto; font:600 22px ui-monospace,monospace; }
  main { display:grid; grid-template-columns: 1fr 300px; gap:0; }
  #stage { padding:12px; }
  canvas { width:100%; height:auto; display:block; border-radius:8px; background:#14181d; }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:12px 14px; height:calc(100vh - 51px); overflow:auto; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:14px 0 6px; font-weight:600; }
  .row { display:flex; align-items:center; gap:8px; padding:4px 0; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .name { width:66px; font-weight:600; }
  .muted { color:var(--muted); }
  .bar { flex:1; height:6px; background:#222831; border-radius:3px; overflow:hidden; }
  .bar > i { display:block; height:100%; }
  #events div { padding:3px 0; border-bottom:1px solid #1d222a; font-size:12px; }
  #events time { color:var(--muted); font-family:ui-monospace,monospace; margin-right:6px; }
  .controls { display:flex; align-items:center; gap:10px; padding:10px 12px 0; }
  button { background:#212731; color:var(--text); border:1px solid #2e3540; border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button.on { background:#2c3a4a; border-color:#4a6a8a; }
  input[type=range] { flex:1; accent-color:#5aa6d6; }
  .legend { display:flex; flex-wrap:wrap; gap:12px; padding:8px 12px; color:var(--muted); font-size:12px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
</style>
</head>
<body>
<header>
  <h1>Plant 7 assembly hall</h1><span class="sub">simulated plant · top-down replay of <code>sim/timeline.jsonl</code></span>
  <span id="clock">--:--:--</span>
</header>
<main>
  <section id="stage">
    <canvas id="c" width="1600" height="960"></canvas>
    <div class="controls">
      <button id="play">❚❚ Pause</button>
      <span class="muted">speed</span>
      <span id="speeds"></span>
      <input id="scrub" type="range" min="0" value="0" step="0.01">
    </div>
    <div class="legend">
      <span><i class="dot" style="background:var(--info)"></i>driving / loading</span>
      <span><i class="dot" style="background:var(--warn)"></i>waiting · starved · blocked</span>
      <span><i class="dot" style="background:var(--bad)"></i>fault · stopped</span>
      <span><i class="dot" style="background:var(--ok)"></i>charging · running</span>
      <span><i class="dot" style="background:#c9a0dc"></i>maintenance tech</span>
      <span><i class="dot" style="background:#9fc5e8"></i>line lead</span>
    </div>
  </section>
  <aside>
    <h2>Conveyor CV-2</h2><div id="belt"></div>
    <h2>Arm C3</h2><div id="arm"></div>
    <h2>AMR fleet</h2><div id="fleet"></div>
    <h2>People</h2><div id="people"></div>
    <h2>Events</h2><div id="events"></div>
  </aside>
</main>
<script>
const D = /*DATA*/null;
const S = D.scene, F = D.frames;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = S.hall.width, H = S.hall.depth, PAD = 1.2;
const K = Math.min(cv.width / (W + 2 * PAD), cv.height / (H + 2 * PAD));
const X = x => (x + PAD) * K, Y = y => cv.height - (y + PAD) * K;  // y up
const COL = { ok:'#5fb37a', warn:'#e0a84a', bad:'#e5604f', info:'#5aa6d6', part:'#e8913a', muted:'#7d8792' };
const NAMES = { 'zone:aisle-a':'Aisle A', 'zone:aisle-b':'Aisle B', 'zone:charging':'Charging bay', 'zone:c3-fence':'Cell C3' };

function rect(r, fill, stroke, dash) {
  const [x0, y0, x1, y1] = r;
  g.save(); if (dash) g.setLineDash(dash);
  if (fill) { g.fillStyle = fill; g.fillRect(X(x0), Y(y1), (x1 - x0) * K, (y1 - y0) * K); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.strokeRect(X(x0), Y(y1), (x1 - x0) * K, (y1 - y0) * K); }
  g.restore();
}
function label(text, x, y, color, size, align) {
  g.fillStyle = color || COL.muted; g.font = `${size || 12}px ui-sans-serif,system-ui`;
  g.textAlign = align || 'left'; g.fillText(text, X(x), Y(y));
}
function arrow(a, b) {
  const [x0, y0] = a, [x1, y1] = b, ang = Math.atan2(Y(y1) - Y(y0), X(x1) - X(x0));
  g.beginPath(); g.moveTo(X(x0), Y(y0)); g.lineTo(X(x1), Y(y1)); g.stroke();
  const mx = (X(x0) + X(x1)) / 2, my = (Y(y0) + Y(y1)) / 2;
  g.beginPath(); g.moveTo(mx + 7 * Math.cos(ang), my + 7 * Math.sin(ang));
  g.lineTo(mx + 7 * Math.cos(ang + 2.5), my + 7 * Math.sin(ang + 2.5));
  g.lineTo(mx + 7 * Math.cos(ang - 2.5), my + 7 * Math.sin(ang - 2.5)); g.fill();
}

function floor() {
  g.fillStyle = '#14181d'; g.fillRect(0, 0, cv.width, cv.height);
  g.strokeStyle = '#1b2027'; g.lineWidth = 1;
  for (let x = 0; x <= W; x++) { g.beginPath(); g.moveTo(X(x), Y(0)); g.lineTo(X(x), Y(H)); g.stroke(); }
  for (let y = 0; y <= H; y++) { g.beginPath(); g.moveTo(X(0), Y(y)); g.lineTo(X(W), Y(y)); g.stroke(); }
  rect([0, 0, W, H], null, '#3a424d');
  for (const [id, r] of Object.entries(S.areas)) { rect(r, null, '#2a313a', [6, 6]); label(id.replace('area:', '').toUpperCase(), r[0] + 0.4, r[3] - 0.7, '#4b5562', 13); }
  rect(S.zones['zone:aisle-a'], 'rgba(90,166,214,0.07)'); rect(S.zones['zone:aisle-b'], 'rgba(90,166,214,0.07)');
  rect(S.zones['zone:charging'], 'rgba(95,179,122,0.08)');
  rect(S.zones['zone:c3-fence'], 'rgba(224,168,74,0.05)', '#b8913d', [8, 5]);
  for (const [id, r] of Object.entries(S.zones)) label(NAMES[id] || id, r[0] + 0.3, r[1] + 0.35, '#6a7582', 12);
  for (const [name, [x, y]] of Object.entries(S.places)) {
    g.fillStyle = '#1d232b'; g.fillRect(X(x - 1.4), Y(y + 1), 2.8 * K, 2 * K);
    label(name.replace('_', ' '), x, y - 1.5, '#55606c', 11, 'center');
  }
  // lanes
  g.strokeStyle = 'rgba(120,140,160,0.35)'; g.fillStyle = 'rgba(120,140,160,0.5)'; g.lineWidth = 1.5; g.setLineDash([4, 4]);
  for (const [a, outs] of Object.entries(S.lanes.edges)) for (const b of outs) arrow(S.lanes.nodes[a], S.lanes.nodes[b]);
  g.setLineDash([]);
  const station = (n, text, color) => { const [x, y] = S.lanes.nodes[n]; g.strokeStyle = color; g.lineWidth = 2; g.strokeRect(X(x - 0.65), Y(y + 0.5), 1.3 * K, K); label(text, x, y + 0.75, color, 11, 'center'); };
  station('PICKUP', 'PICKUP', '#5aa6d6'); station('DROP', 'DROP → assembly', '#5aa6d6'); station('STAGE', 'stage', '#4b5562');
  station('PARK_A', 'park', '#4b5562'); station('PARK_B', 'park', '#4b5562');
  for (const c of S.lanes.chargers) station(c, '⚡ charger', '#5fb37a');
}

function conveyor(f, pulse) {
  const [x0, y0] = S.conveyor.start, [x1] = S.conveyor.end, w = 0.8, [state, alarm, sp, travel] = f.c;
  g.fillStyle = state === 'stopped' ? '#3a2523' : '#2a2f36'; g.fillRect(X(x0), Y(y0 + w / 2), (x1 - x0) * K, w * K);
  g.strokeStyle = state === 'stopped' ? '#7a3a33' : '#3c434c'; g.lineWidth = 1.5;
  const off = travel % 0.5;
  for (let s = 0.5 - off; s < x1 - x0; s += 0.5) { g.beginPath(); g.moveTo(X(x0 + s), Y(y0 + w / 2)); g.lineTo(X(x0 + s), Y(y0 - w / 2)); g.stroke(); }
  g.strokeStyle = '#4a525c'; g.lineWidth = 2; g.strokeRect(X(x0), Y(y0 + w / 2), (x1 - x0) * K, w * K);
  label(`CV-2 · ${state} · ${sp.toFixed(2)} m/s`, x0, y0 + 0.75, state === 'stopped' ? COL.bad : '#8a96a3', 12);
  const [px, py] = S.conveyor.pe3;
  if (alarm) { g.fillStyle = `rgba(229,96,79,${0.25 + 0.25 * pulse})`; g.beginPath(); g.arc(X(px), Y(py), (1.4 + 0.5 * pulse) * K, 0, 7); g.fill(); }
  g.fillStyle = alarm ? COL.bad : '#c7cdd4'; g.fillRect(X(px) - 3, Y(py - w / 2) , 6, 8); g.fillRect(X(px) - 3, Y(py + w / 2) - 8, 6, 8);
  label(alarm ? 'PE3 · JAM' : 'PE3', px, py - 0.95, alarm ? COL.bad : '#7d8792', 11, 'center');
  for (const [s, jammed] of f.p) {
    const cx = X(x0 + s), cy = Y(y0), sz = 0.42 * K;
    g.save(); g.translate(cx, cy); if (jammed) g.rotate(0.6);
    g.fillStyle = jammed ? COL.bad : COL.part; g.fillRect(-sz / 2, -sz / 2, sz, sz); g.restore();
  }
}

function arm(f, pulse) {
  const [mode, phase, holding, tcp] = f.a, [bx, by] = S.arm.base;
  const color = mode === 'protective_stop' ? COL.bad : (mode === 'idle_starved' || mode === 'blocked') ? COL.warn : mode === 'running' ? COL.ok : COL.muted;
  if (mode === 'protective_stop') { g.fillStyle = `rgba(229,96,79,${0.2 + 0.2 * pulse})`; g.beginPath(); g.arc(X(bx), Y(by), 3 * K, 0, 7); g.fill(); }
  const [tx, ty] = tcp, mx = (bx + tx) / 2, my = (by + ty) / 2, dx = tx - bx, dy = ty - by, n = Math.hypot(dx, dy) || 1;
  const ex = mx - dy / n * 0.45, ey = my + dx / n * 0.45;
  g.lineCap = 'round'; g.strokeStyle = '#d9dee4'; g.lineWidth = 0.42 * K;
  g.beginPath(); g.moveTo(X(bx), Y(by)); g.lineTo(X(ex), Y(ey)); g.lineTo(X(tx), Y(ty)); g.stroke();
  g.strokeStyle = color; g.lineWidth = 0.18 * K;
  g.beginPath(); g.moveTo(X(bx), Y(by)); g.lineTo(X(ex), Y(ey)); g.lineTo(X(tx), Y(ty)); g.stroke();
  g.fillStyle = '#2a2f36'; g.beginPath(); g.arc(X(bx), Y(by), 0.6 * K, 0, 7); g.fill();
  g.strokeStyle = color; g.lineWidth = 3; g.stroke();
  if (holding) { g.fillStyle = COL.part; g.fillRect(X(tx) - 0.2 * K, Y(ty) - 0.2 * K, 0.4 * K, 0.4 * K); }
  label(`Arm C3 · ${mode.replace('_', ' ')}`, bx + 0.9, by + 1.2, color, 12);
}

function amrColor(r) {
  const [, , , mode, , , task, st, stranded, charging] = r;
  if (stranded) return COL.bad;
  if (charging) return COL.ok;
  if (mode === 'PAUSED' || st === 'waiting' || st === 'blocked') return COL.warn;
  if (mode === 'MANUAL') return '#c9a0dc';
  return COL.info;
}
function amr(r, id, pulse) {
  const [x, y, yaw, mode, bat, tote, task, st, stranded, charging] = r, c = amrColor(r);
  if (stranded) { g.fillStyle = `rgba(229,96,79,${0.25 + 0.3 * pulse})`; g.beginPath(); g.arc(X(x), Y(y), (1.3 + 0.4 * pulse) * K, 0, 7); g.fill(); }
  g.save(); g.translate(X(x), Y(y)); g.rotate(-yaw);
  const L = 1.1 * K, Wd = 0.75 * K;
  g.fillStyle = '#23292f'; g.strokeStyle = c; g.lineWidth = 3;
  g.beginPath(); g.roundRect(-L / 2, -Wd / 2, L, Wd, 6); g.fill(); g.stroke();
  g.fillStyle = c; g.fillRect(L / 2 - 6, -Wd / 4, 4, Wd / 2);  // front
  for (let i = 0; i < tote; i++) { g.fillStyle = COL.part; g.fillRect(-L / 2 + 6 + (i % 3) * 0.24 * K, -Wd / 2 + 6 + Math.floor(i / 3) * 0.24 * K, 0.18 * K, 0.18 * K); }
  g.restore();
  label(`${id.replace('robot:', '')} ${Math.round(bat)}%${charging ? ' ⚡' : ''}`, x, y + 0.75, c, 12, 'center');
}

function person(h, meta) {
  const [x, y, act, present] = h; if (!present) return;
  const lead = meta[1] === 'line lead', c = lead ? '#9fc5e8' : '#c9a0dc';
  const busy = /clearing|resetting|cleaning|rescuing/.test(act);
  if (busy) { g.strokeStyle = c; g.lineWidth = 2; g.beginPath(); g.arc(X(x), Y(y), 0.6 * K, 0, 7); g.stroke(); }
  g.fillStyle = c; g.beginPath(); g.arc(X(x), Y(y), 0.3 * K, 0, 7); g.fill();
  const name = meta[0].replace('person:', '');
  label(name[0].toUpperCase() + name.slice(1), x, y - 0.75, c, 12, 'center');
  if (act !== 'idle' && act !== 'supervising') label(act.replace('_', ' '), x, y - 1.25, '#8a96a3', 10, 'center');
}

// --- interpolation and playback ---
const lerp = (a, b, k) => a + (b - a) * k;
const lerpAng = (a, b, k) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * k; };
function mix(a, b, k) {
  if (!b) return a;
  const out = { ...a };
  out.c = [...a.c]; out.c[3] = lerp(a.c[3], b.c[3], k);
  out.p = a.p.length === b.p.length ? a.p.map((p, i) => [lerp(p[0], b.p[i][0], k), p[1]]) : a.p;
  out.a = [...a.a]; out.a[3] = a.a[3].map((v, i) => lerp(v, b.a[3][i], k));
  out.r = a.r.map((r, i) => { const s = b.r[i], o = [...r]; if (Math.hypot(s[0] - r[0], s[1] - r[1]) < 6) { o[0] = lerp(r[0], s[0], k); o[1] = lerp(r[1], s[1], k); o[2] = lerpAng(r[2], s[2], k); } return o; });
  out.h = a.h.map((h, i) => { const s = b.h[i], o = [...h]; if (s[3] && h[3]) { o[0] = lerp(h[0], s[0], k); o[1] = lerp(h[1], s[1], k); } return o; });
  return out;
}

const scrub = document.getElementById('scrub'); scrub.max = F.length - 1;
let pos = 0, speed = 30, playing = true, last = performance.now(), shownEvents = -1;
const speeds = [10, 30, 60, 120, 300];
const sp = document.getElementById('speeds');
for (const s of speeds) { const b = document.createElement('button'); b.textContent = s + 'x'; b.onclick = () => { speed = s; [...sp.children].forEach(c => c.classList.toggle('on', c === b)); }; if (s === speed) b.classList.add('on'); sp.appendChild(b); }
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? '❚❚ Pause' : '▶ Play'; };
scrub.oninput = () => { pos = +scrub.value; shownEvents = -1; };

function side(f) {
  const [state, alarm, spd, , dirt] = f.c;
  document.getElementById('belt').innerHTML = `<div class="row"><i class="dot" style="background:${state === 'stopped' ? COL.bad : state === 'running' ? COL.ok : COL.muted}"></i><span class="name">${state}</span><span class="muted">${alarm || 'no alarm'} · ${spd.toFixed(2)} m/s</span></div>
    <div class="row"><span class="name muted">PE3 lens</span><span class="bar"><i style="width:${Math.min(100, dirt / 1.5 * 100)}%;background:${COL.warn}"></i></span><span class="muted">hidden truth</span></div>`;
  const am = f.a[0];
  document.getElementById('arm').innerHTML = `<div class="row"><i class="dot" style="background:${am === 'protective_stop' ? COL.bad : am === 'running' ? COL.ok : COL.warn}"></i><span class="name">${am.replace('_', ' ')}</span><span class="muted">${f.a[1]}</span></div>`;
  document.getElementById('fleet').innerHTML = f.r.map((r, i) => `<div class="row"><i class="dot" style="background:${amrColor(r)}"></i><span class="name">${D.amrs[i].replace('robot:', '')}</span>
    <span class="bar"><i style="width:${r[4]}%;background:${r[4] < 25 ? COL.bad : COL.ok}"></i></span><span class="muted" style="width:96px">${r[8] ? 'STOPPED' : r[9] ? 'charging' : (r[6] || 'idle') + ' · ' + r[7]}</span></div>`).join('');
  document.getElementById('people').innerHTML = f.h.map((h, i) => `<div class="row"><i class="dot" style="background:${D.people[i][1] === 'line lead' ? '#9fc5e8' : '#c9a0dc'}"></i><span class="name">${D.people[i][0].replace('person:', '')}</span><span class="muted">${h[3] ? h[2].replace('_', ' ') : 'off shift'}</span></div>`).join('');
}
function events(i) {
  if (i === shownEvents) return; shownEvents = i;
  const out = [];
  for (let j = 0; j <= i; j++) for (const e of F[j].e) out.push(`<div><time>${F[j].t.slice(11)}</time>${e}</div>`);
  document.getElementById('events').innerHTML = out.reverse().join('') || '<span class="muted">none yet</span>';
}

function frame(now) {
  const dt = Math.max(0, now - last) / 1000; last = now;
  if (playing) { pos = Math.min(F.length - 1, pos + dt * speed / D.every); if (pos >= F.length - 1) pos = 0; scrub.value = pos; }
  const i = Math.floor(pos), f = mix(F[i], F[i + 1], pos - i), pulse = (Math.sin(now / 180) + 1) / 2;
  floor(); conveyor(f, pulse); arm(f, pulse);
  f.r.forEach((r, k) => amr(r, D.amrs[k], pulse));
  f.h.forEach((h, k) => person(h, D.people[k]));
  document.getElementById('clock').textContent = F[i].t.replace('T', '  ');
  side(f); events(i);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
