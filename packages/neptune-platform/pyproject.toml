# Workspace member generated from packages/_template by scripts/new-package.sh.
# Dev tools (ruff, mypy, pytest) come from the root project's `dev` group; `make setup` installs them.
[project]
name = "neptune-platform"
version = "0.0.1"
description = "neptune-platform: a Neptune workspace member."
requires-python = ">=3.11"
authors = [{ name = "Benjamin Tay", email = "benjamintay07@gmail.com" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptune_platform"]

# Shared lint rules live in the root pyproject; paths below are relative to this package.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
# The repository root, so the tests can import the integration harness (harness/, MVL-123).
mypy_path = "src:../.."

# The docs site (docsite/, platform ADR 0012) calls Sphinx, whose sources use Python 3.12 syntax
# that mypy cannot parse while it targets 3.11, and docutils ships no types; their names are Any.
[[tool.mypy.overrides]]
module = ["sphinx", "sphinx.*", "docutils", "docutils.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.."]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = [
  "integration: exercises multiple components against real fixtures",
  "slow: takes more than a few seconds; excluded by `make test-fast`",
]
# The compiler's sandbox forks once per adapter call, after pyarrow's thread pool exists; the harness
# tests run real ingests (root pyproject.toml carries the same filter and the reasoning).
filterwarnings = [
  "ignore:This process \\(pid=\\d+\\) is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child:DeprecationWarning",
]
