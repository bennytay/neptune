# Workspace member generated from packages/_template by scripts/new-package.sh.
# Dev tools (ruff, mypy, pytest) come from the root project's `dev` group; `make setup` installs them.
[project]
name = "neptune-ledger"
version = "0.0.1"
description = "Neptune Ledger: catalog, entity threads, lakehouse and lineage over compiled Neptune packages."
requires-python = ">=3.11"
authors = [{ name = "Benjamin Tay", email = "benjamintay07@gmail.com" }]
# psycopg 3 is the PostgreSQL driver for the catalog (ADR 0002). Pinned; bump deliberately.
# pyarrow: query() returns a pyarrow.Table (catalog API, ADR 0004); same floor as the compiler.
# duckdb and datafusion scan packages' series Parquet in place (ADR 0013). Pinned: a new engine
# version can change plans and pruning, so a bump re-runs the pushdown and budget tests.
# The media store (ADR 0014): pylance holds extracted artefacts as Lance blobs; mcap and
# mcap-ros2-support read frames from MCAP, whose chunks lz4 and zstandard inflate (bounded, in
# lake.decode), pillow encodes rasters, pypdfium2 renders pages and pyyaml reads YAML for JSON
# pointers. Each one's version is part of every artefact's transform,
# so all are pinned: a bump is a new extraction lineage.
dependencies = [
  "datafusion==54.0.0",
  "duckdb==1.5.6",
  "lz4==4.4.5",
  "mcap==1.5.0",
  "mcap-ros2-support==0.5.7",
  "neptune",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.6",
  "pyarrow>=25.0.1",
  "pylance==12.0.0",
  "pypdfium2==5.13.0",
  "pyyaml==6.0.3",
  "zstandard==0.25.0",
]

# `ledger register <root>`, `ledger verify <id>` (MVL-90); a thin front end until access/ lands.
[project.scripts]
ledger = "neptune_ledger.cli:main"

# What a downstream package needs to run neptune_ledger.contract_tests against its implementation.
[project.optional-dependencies]
contract-tests = ["jsonschema>=4.23", "pytest>=8.3"]

# pgserver ships PostgreSQL 16 binaries in a wheel, so the catalog migration tests run against a real
# PostgreSQL 16 in CI with no service container (ADR 0002 §8). Test-only.
[dependency-groups]
dev = ["pgserver==0.1.4"]

[tool.uv.sources]
neptune = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neptune_ledger"]

# Shared lint rules live in the root pyproject; paths below are relative to this package.
[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
mypy_path = "src"

# pyarrow ships no type information; api.arrow and lake/ import it. datafusion's object_store
# module is a compiled extension without stubs.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "datafusion.object_store", "pypdfium2", "mcap_ros2.*", "lz4", "lz4.*"]
ignore_missing_imports = true

# numpy (from pylance and Pillow) ships stubs in Python 3.12 syntax, which a 3.11 check cannot
# parse; the Ledger never calls numpy, so its stubs are not followed.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
markers = [
  "integration: exercises multiple components against real fixtures",
  "slow: takes more than a few seconds; excluded by `make test-fast`",
]
