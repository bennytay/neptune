# Field trial 2026-09-28, run B: faster planner.
controller_server:
  ros__parameters:
    controller_frequency: 20.0   # unchanged, moved
    use_sim_time: false
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      max_vel_x: 0.31
      max_vel_theta: 1.0
      sim_time: 1.5
      critics: ["RotateToGoal", "BaseObstacle", "Oscillation"]
      xy_goal_tolerance: 0.25
