<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plant 7 · film</title>
<style>
  html, body { margin: 0; background: #0d0f12; overflow: hidden; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: #f2f4f7; }
  #brand { position: absolute; left: 3.2vw; top: 3.4vh; font-size: 1.15vw; letter-spacing: 0.32em; font-weight: 600; opacity: 0.85; }
  #brand b { color: #7fc3ff; font-weight: 700; }
  #clock { position: absolute; right: 3.2vw; top: 3vh; text-align: right; font-variant-numeric: tabular-nums; }
  #clock .t { font-size: 2.2vw; font-weight: 600; letter-spacing: 0.04em; }
  #clock .d { font-size: 0.85vw; letter-spacing: 0.25em; opacity: 0.7; }
  #clock .x { font-size: 0.85vw; letter-spacing: 0.15em; color: #ffc861; margin-top: 0.4vh; }
  #caption { position: absolute; left: 3.2vw; bottom: 6vh; max-width: 52vw; }
  #caption .k { font-size: 0.85vw; letter-spacing: 0.3em; color: #7fc3ff; text-transform: uppercase; margin-bottom: 0.8vh; }
  #caption .s { font-size: 2.0vw; font-weight: 600; line-height: 1.2; text-shadow: 0 2px 18px rgba(0,0,0,0.6); }
  #caption .bar { width: 4vw; height: 0.35vh; background: #7fc3ff; margin-bottom: 1.4vh; }
  #title { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(ellipse at center, rgba(8,10,14,0.55), rgba(8,10,14,0.85)); }
  #title .a { font-size: 5vw; font-weight: 700; letter-spacing: 0.06em; }
  #title .b { font-size: 1.2vw; letter-spacing: 0.4em; opacity: 0.8; margin-top: 1.5vh; text-transform: uppercase; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.38) 100%); }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="hud">
  <div id="vignette"></div>
  <div id="brand"><b>NEPTUNE</b> &nbsp;·&nbsp; PLANT 7 ASSEMBLY HALL</div>
  <div id="clock"><div class="t">--:--:--</div><div class="d">SITE TIME</div><div class="x"></div></div>
  <div id="caption"><div class="bar"></div><div class="k"></div><div class="s"></div></div>
  <div id="title"><div class="a">Plant 7</div><div class="b">a simulated site · every robot, machine and person</div></div>
</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';

const DATA = new URLSearchParams(location.search).get('data') || '/data';
const get = async (p) => (await fetch(`${DATA}/${p}`)).json();

// --- Procedural textures ---------------------------------------------------------------------
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function canvasTex(w, h, draw, repeat = [1, 1], srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat);
  t.anisotropy = 8; if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t;
}
function noise(g, w, h, base, spread, seed, blobs = 9000) {
  g.fillStyle = base; g.fillRect(0, 0, w, h); const r = rng(seed);
  for (let i = 0; i < blobs; i++) {
    const v = Math.floor((r() - 0.5) * spread); const a = 0.04 + r() * 0.08;
    g.fillStyle = `rgba(${128 + v},${128 + v},${128 + v},${a})`;
    const s = 1 + r() * 26; g.beginPath(); g.arc(r() * w, r() * h, s, 0, 7); g.fill();
  }
}
const TEX = {
  concrete: canvasTex(1024, 1024, (g, w, h) => {
    noise(g, w, h, '#5f6163', 110, 7);
    g.strokeStyle = 'rgba(40,40,40,0.25)'; g.lineWidth = 2; // saw-cut joints
    for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); }
  }, [12, 8]),
  concreteRough: canvasTex(512, 512, (g, w, h) => noise(g, w, h, '#8a8a8a', 160, 11, 6000), [18, 12], false),
  epoxy: canvasTex(512, 512, (g, w, h) => noise(g, w, h, '#6f7680', 50, 5, 4000), [14, 3]),
  wall: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#c9ccd0'; g.fillRect(0, 0, w, h);
    for (let x = 0; x < w; x += 16) { const gr = g.createLinearGradient(x, 0, x + 16, 0); gr.addColorStop(0, '#b7bbc0'); gr.addColorStop(0.5, '#d6d9dc'); gr.addColorStop(1, '#b3b7bc'); g.fillStyle = gr; g.fillRect(x, 0, 16, h); }
  }, [60, 4]),
  belt: canvasTex(256, 64, (g, w, h) => { g.fillStyle = '#121214'; g.fillRect(0, 0, w, h); g.fillStyle = '#1d1d21'; for (let x = 0; x < w; x += 8) g.fillRect(x, 0, 3, h); }, [80, 1]),
  mesh: canvasTex(128, 128, (g, w, h) => {
    g.clearRect(0, 0, w, h); g.strokeStyle = '#2b2d30'; g.lineWidth = 6;
    for (let i = 0; i <= w; i += 32) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i, h); g.stroke(); g.beginPath(); g.moveTo(0, i); g.lineTo(w, i); g.stroke(); }
  }, [10, 18]),
  carton: canvasTex(256, 256, (g, w, h) => { noise(g, w, h, '#a27d55', 40, 3, 2500); g.fillStyle = 'rgba(180,150,110,0.9)'; g.fillRect(0, h * 0.45, w, h * 0.1); }),
};
function signTex(text, sub, bg, fg) {
  return canvasTex(1024, 256, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.fillStyle = fg; g.font = '700 110px Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, w / 2, sub ? h * 0.42 : h / 2);
    if (sub) { g.font = '500 44px Helvetica, Arial, sans-serif'; g.globalAlpha = 0.8; g.fillText(sub, w / 2, h * 0.8); }
  });
}
const SIGNS = {
  sign_plant7: signTex('PLANT 7', 'ASSEMBLY HALL', '#14243a', '#e8eef5'),
  sign_c3: signTex('CELL C3', 'ROBOT ZONE · KEEP OUT', '#f2c014', '#141414'),
  sign_charge: signTex('CHARGING', 'AMR BAY', '#196b3e', '#ffffff'),
  sign_assembly: signTex('ASSEMBLY', 'LINE 2 · STATIONS 1-2', '#14243a', '#e8eef5'),
};
const SIGN_FACE = { sign_plant7: 3, sign_c3: 3, sign_assembly: 3, sign_charge: 0 };  // BoxGeometry face

// --- Materials ---------------------------------------------------------------------------------
const mats = {};
function material(name, spec, path) {
  const key = name + (spec.opacity < 1 ? '' : '');
  if (name.startsWith('carton') || name.startsWith('bin_')) {  // vary each box a little
    const r = rng([...path].reduce((a, c) => a * 31 + c.charCodeAt(0), 7))();
    const m = make(name, spec); m.color.offsetHSL((r - 0.5) * 0.03, 0, (r - 0.5) * 0.08); return m;
  }
  return mats[key] || (mats[key] = make(name, spec));
}
function make(name, spec) {
  const c = new THREE.Color().setRGB(...spec.color, THREE.SRGBColorSpace);
  if (spec.emissive) {
    const m = new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: Math.max(...spec.emissive) / Math.max(...spec.color, 0.01) * 0.4, roughness: 0.4 });
    return m;
  }
  const p = { color: c, roughness: spec.roughness, metalness: spec.metallic };
  if (name === 'floor') Object.assign(p, { map: TEX.concrete, roughnessMap: TEX.concreteRough, roughness: 0.7, clearcoat: 0.15, clearcoatRoughness: 0.6, color: new THREE.Color(0xffffff) });
  if (name === 'aisle') Object.assign(p, { map: TEX.epoxy, roughness: 0.5, clearcoat: 0.25, clearcoatRoughness: 0.5, color: new THREE.Color(0x8f9aa8) });
  if (name === 'charging_floor') Object.assign(p, { map: TEX.epoxy, roughness: 0.4, clearcoat: 0.5, color: new THREE.Color(0x8fb59b) });
  if (name === 'wall') Object.assign(p, { map: TEX.wall, color: new THREE.Color(0xffffff), roughness: 0.6, metalness: 0.3 });
  if (name === 'belt') Object.assign(p, { map: TEX.belt, color: new THREE.Color(0xffffff) });
  if (name === 'carton' || name === 'carton_light') Object.assign(p, { map: TEX.carton, color: c.clone().multiplyScalar(1.4) });
  if (name === 'mesh') Object.assign(p, { map: TEX.mesh, alphaTest: 0.5, transparent: false, side: THREE.DoubleSide, color: new THREE.Color(0xffffff), metalness: 0.6, roughness: 0.45 });
  if (name === 'glass') Object.assign(p, { transparent: true, opacity: 0.18, roughness: 0.05, metalness: 0.1, clearcoat: 1 });
  if (name === 'yellow' || name === 'fence') Object.assign(p, { clearcoat: 0.4 });
  if (name === 'white_line') Object.assign(p, { color: new THREE.Color(0xa9adb2), roughness: 0.8 });
  if (name.startsWith('arm_orange')) Object.assign(p, { clearcoat: 0.8, clearcoatRoughness: 0.15, roughness: 0.3 });
  if (name === 'amr_body' || name === 'amr_deck') Object.assign(p, { clearcoat: 0.5, clearcoatRoughness: 0.2 });
  return new THREE.MeshPhysicalMaterial(p);
}

// --- Scene -------------------------------------------------------------------------------------
const NO_SHADOW = /lane_|spot_|_edge|Hatch|Chevron|Window|Fixture|Glow|Lens|Status_|_on$|Floor\//;
async function buildScene() {
  const S = await get('scene.json');
  const scene = new THREE.Scene();
  const objs = [];
  for (const n of S.nodes) {
    let o;
    const m = new THREE.Matrix4().fromArray(n.m || new THREE.Matrix4().toArray());
    if (n.type === 'Cube') {
      const pos = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3(); m.decompose(pos, q, sc);
      const [x, y, z] = [sc.x * n.size, sc.y * n.size, sc.z * n.size];
      const small = Math.min(x, y, z), rounded = small > 0.03 && Math.max(x, y, z) < 4 && !NO_SHADOW.test(n.path);
      const geo = rounded ? new RoundedBoxGeometry(x, y, z, 2, Math.min(0.025, small * 0.2)) : new THREE.BoxGeometry(x, y, z);
      const spec = S.materials[n.material];
      let mat = material(n.material, spec, n.path);
      if (SIGNS[n.material]) { mat = Array(6).fill(mat); mat[SIGN_FACE[n.material]] = new THREE.MeshStandardMaterial({ map: SIGNS[n.material], roughness: 0.5 }); }
      if (n.material === 'floor' || n.material === 'aisle' || n.material === 'charging_floor') {
        const t = [TEX.concrete, TEX.epoxy];  // texture repeat follows the slab's size
        if (n.material === 'aisle') { mat = mat.clone(); mat.map = TEX.epoxy.clone(); mat.map.repeat.set(x / 3, y / 3); mat.map.needsUpdate = true; }
      }
      o = new THREE.Mesh(geo, mat); o.position.copy(pos); o.quaternion.copy(q);
      o.matrixAutoUpdate = true;
    } else if (n.type === 'Cylinder' || n.type === 'Capsule' || n.type === 'Sphere') {
      let geo;
      if (n.type === 'Sphere') geo = new THREE.SphereGeometry(n.radius, 32, 20);
      else {
        geo = n.type === 'Cylinder' ? new THREE.CylinderGeometry(n.radius, n.radius, n.height, 36) : new THREE.CapsuleGeometry(n.radius, n.height, 8, 20);
        if (n.axis === 'Z') geo.rotateX(Math.PI / 2); else if (n.axis === 'X') geo.rotateZ(Math.PI / 2);
      }
      o = new THREE.Mesh(geo, material(n.material, S.materials[n.material], n.path));
      o.matrixAutoUpdate = false; o.matrix.copy(m);
    } else if (n.type === 'SphereLight') {
      o = new THREE.PointLight(new THREE.Color(...n.color), 6, 7, 2);
      o.matrixAutoUpdate = false; o.matrix.copy(m);
    } else {
      o = new THREE.Group(); o.matrixAutoUpdate = false; o.matrix.copy(m);
    }
    if (o.isMesh) { const glow = !!S.materials[n.material]?.emissive; o.castShadow = !glow && !NO_SHADOW.test(n.path) && n.material !== 'glass'; o.receiveShadow = !glow; }
    o.name = n.path; o.visible = !n.hidden;
    (n.parent >= 0 ? objs[n.parent] : scene).add(o);
    objs.push(o);
  }
  return { scene, objs, nodes: S.nodes };
}

// --- Renderer ----------------------------------------------------------------------------------
let R, composer, scene, objs, camera, shot, bin, meta, shots;
window.setup = async (name, width, height, quality) => {
  if (!R) {
    R = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    R.setPixelRatio(1); document.body.appendChild(R.domElement);
    R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 0.82;
    R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
    ({ scene, objs } = await buildScene());
    const pm = new THREE.PMREMGenerator(R); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.55;
    scene.background = new THREE.Color(0x14171c); scene.fog = new THREE.Fog(0x14171c, 70, 140);
    scene.add(new THREE.HemisphereLight(0xdfe8f5, 0x3a3630, 0.55));
    const sun = new THREE.DirectionalLight(0xfff1dc, 2.6); sun.position.set(6, -10, 30); sun.target.position.set(20, 12, 0);
    sun.castShadow = true; sun.shadow.mapSize.set(quality === 'final' ? 4096 : 2048, quality === 'final' ? 4096 : 2048);
    Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 22, bottom: -22, near: 1, far: 80 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4;
    scene.add(sun, sun.target);
    for (const [x, y] of [[8, 9], [20, 9], [32, 9], [8, 18], [20, 18], [32, 18]]) {  // fill from the bay lights
      const l = new THREE.PointLight(0xfff4e6, 9, 20, 1.8); l.position.set(x, y, 5.6); scene.add(l);
    }
    shots = await get('film-shots.json');
  }
  R.setSize(width, height);
  meta = await get(`${name}.json`);
  bin = new Float32Array(await (await fetch(`${DATA}/${name}.bin`)).arrayBuffer());
  shot = shots.find((s) => s.name === name);
  const fov = 2 * Math.atan(meta.vertical_aperture / 2 / meta.focal) * 180 / Math.PI;
  camera = new THREE.PerspectiveCamera(fov, width / height, 0.05, 400); camera.matrixAutoUpdate = false;
  composer = new EffectComposer(R);
  composer.addPass(new RenderPass(scene, camera));
  if (quality !== 'draft') { const ao = new GTAOPass(scene, camera, width, height); ao.updateGtaoMaterial({ radius: 0.6, distanceExponent: 1.5, thickness: 1.0, scale: 1.0, samples: quality === 'final' ? 16 : 8 }); ao.blendIntensity = 0.85; composer.addPass(ao); }
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(width, height), 0.45, 0.4, 1.05));
  composer.addPass(new OutputPass());
  composer.addPass(new SMAAPass(width, height));
  return meta.frames;
};

function pad(n) { return String(n).padStart(2, '0'); }
window.frame = (f) => {
  const per = meta.moving.length + 1;
  const base = f * per * 16;
  meta.moving.forEach((i, k) => {
    const o = objs[i]; const m = new THREE.Matrix4().fromArray(bin, base + k * 16);
    if (o.matrixAutoUpdate) m.decompose(o.position, o.quaternion, o.scale); else o.matrix.copy(m);
  });
  camera.matrix.fromArray(bin, base + meta.moving.length * 16); camera.updateMatrixWorld(true);
  meta.toggled.forEach((i, k) => {
    const runs = meta.visible[k]; let v = runs[0][1];
    for (const [start, val] of runs) { if (start > f) break; v = val; }
    objs[i].visible = !!v;
  });
  scene.updateMatrixWorld(true);
  // HUD: site clock, speed, caption, title card.
  const t = new Date(Date.parse(shot.start + 'Z') + f / meta.fps * shot.speed * 1000);
  document.querySelector('#clock .t').textContent = `${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())}:${pad(t.getUTCSeconds())}`;
  document.querySelector('#clock .d').textContent = `SITE TIME · ${t.toISOString().slice(0, 10)}`;
  document.querySelector('#clock .x').textContent = shot.speed > 1.5 ? `${Math.round(shot.speed)}× SPEED` : 'REAL TIME';
  document.querySelector('#caption .k').textContent = shot.name.replace(/^\d+_/, '').replace('_', ' ');
  document.querySelector('#caption .s').textContent = shot.note.charAt(0).toUpperCase() + shot.note.slice(1);
  const fade = (a, b) => Math.max(0, Math.min(1, (f - a) / (b - a)));
  const n = meta.frames, s = meta.fps;
  document.getElementById('caption').style.opacity = String(fade(0.4 * s, 1.0 * s) * (1 - fade(n - 0.6 * s, n - 0.1 * s)));
  const title = document.getElementById('title');
  title.style.display = shot.name.startsWith('01') ? 'flex' : 'none';
  title.style.opacity = String(1 - fade(2.2 * s, 3.4 * s));
  document.getElementById('hud').style.opacity = String(fade(0, 0.3 * s) * (1 - fade(n - 0.25 * s, n)));
  composer.render();
  return true;
};
window.ready = true;
</script>
</body>
</html>
