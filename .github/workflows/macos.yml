# macOS: the README's quickstart and `harness.up` over one site folder with no setup, on GitHub's
# macOS runners. Not a required check (the PR jobs run on Linux): nightly and on demand.
# The sandbox needs Linux, so on macOS adapters run in_process (the demo says so; up is told).
name: macos
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: quickstart
        run: bash scripts/quickstart.sh
      - name: up over the S-007 site, no setup
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run --all-packages --all-groups python - <<'PY'
          from pathlib import Path
          import shutil
          from harness import acceptance
          root = acceptance.materialise(Path("/tmp/corpus"))
          shutil.copytree(root / "sites" / "S-007", "/tmp/S-007")
          PY
          uv run --all-packages --all-groups python -m harness.up /tmp/S-007 --out /tmp/up-out --isolation in_process
          cat /tmp/up-out/up.md
