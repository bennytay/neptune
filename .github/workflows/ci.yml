name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install project and dev tools
        run: make setup
      - name: Lint, type-check, test
        run: make check
