name: ci

# One job per workspace package, selected by .github/scripts/ci_plan.py from the PR's changed paths;
# merge-queue groups, pushes to main and the nightly run every job. `check` aggregates them and is the only
# required status: a skipped package job counts as success, a failed or cancelled one fails it.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  # Nightly: every job with the full suite (`make check-all`), on main.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run; main and nightly runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tests run on every core (pytest-xdist); the 15 slowest are printed. A PR runs `make check`
# (slow tests excluded); main, the nightly schedule and a manual dispatch run `make check-all`.
env:
  PYTEST_WORKERS: auto
  PYTEST_ARGS: --durations=15
  CHECK: ${{ github.event_name == 'pull_request' && 'check' || 'check-all' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 90 }}
    outputs:
      compiler: ${{ steps.plan.outputs.compiler }}
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Select jobs from changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 .github/scripts/ci_plan.py "$EVENT" "$BASE" "$HEAD"
          else
            python3 .github/scripts/ci_plan.py "$EVENT"
          fi

  neptune:
    needs: plan
    if: needs.plan.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 90 }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install workspace and dev tools
        run: make setup
      - name: Lint, type-check, test
        run: make "$CHECK" PKG=neptune

  package:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install workspace and dev tools
        run: make setup
      - name: Fetch the public site (#211's gold questions; they skip without it)
        if: github.event_name != 'pull_request' && matrix.package == 'neptune-memory'
        run: scripts/fetch_public_site.sh site-public
      - name: Lint, type-check, test
        env:
          PACKAGE: ${{ matrix.package }}
        run: make "$CHECK" PKG="$PACKAGE"

  check:
    needs: [plan, neptune, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 90 }}
    steps:
      - name: Require every selected job to succeed or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "a required job failed or was cancelled" >&2
            exit 1
          fi
