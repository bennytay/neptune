name: ci

# One job per workspace package, selected by .github/scripts/ci_plan.py from the PR's changed paths;
# merge-queue groups and pushes to main run every job. `check` aggregates them and is the only
# required status: a skipped package job counts as success, a failed or cancelled one fails it.
# The `docs` job builds the documentation site on every event, unfiltered.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      compiler: ${{ steps.plan.outputs.compiler }}
      packages: ${{ steps.plan.outputs.packages }}
      template: ${{ steps.plan.outputs.template }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Select jobs from changed paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 .github/scripts/ci_plan.py "$EVENT" "$BASE" "$HEAD"
          else
            python3 .github/scripts/ci_plan.py "$EVENT"
          fi

  neptune:
    needs: plan
    if: needs.plan.outputs.compiler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install workspace and dev tools
        run: make setup
      - name: Lint, type-check, test
        run: make check PKG=neptune
      - name: Contracts (owner rule)
        run: make contracts-check PKG=neptune

  package:
    needs: plan
    if: needs.plan.outputs.packages != '[]'
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install workspace and dev tools
        run: make setup
      - name: Lint, type-check, test
        env:
          PACKAGE: ${{ matrix.package }}
        run: make check PKG="$PACKAGE"
      - name: Contracts (lock, owner rule, upstream contract tests)
        env:
          PACKAGE: ${{ matrix.package }}
        run: make contracts-check PKG="$PACKAGE"

  template:
    needs: plan
    if: needs.plan.outputs.template == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Generate a package from the template
        run: scripts/new-package.sh ci-template-smoke
      - name: Install workspace and dev tools
        run: make setup
      - name: Check the generated package
        run: make check PKG=ci-template-smoke
      - name: Contracts check of the generated package
        run: make contracts-check PKG=ci-template-smoke

  # The documentation site (packages/neptune-platform ADR 0012), on every event: any repository
  # path can be a link target and every public module is a page, so no path filter is safe.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install workspace and dev tools
        run: make setup
      - name: Build the documentation site (strict, offline)
        run: make docs

  check:
    needs: [plan, neptune, package, template, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected job to succeed or be skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "a required job failed or was cancelled" >&2
            exit 1
          fi
