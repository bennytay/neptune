name: harness

# The integration harness (MVL-123, packages/neptune-platform ADR 0004): contracts check, the corpus
# (the acceptance corpus, ADR 0007) through compiler -> deploy -> ledger -> memory -> context
# (ADR 0008), a smoke query, one report. It needs no Docker while every real stage runs in process
# (the ledger on an embedded PostgreSQL, platform ADR 0006; memory and context over its catalog,
# ADR 0011). It is not a required status yet: `ci.yml`'s `check` is the only one.
#
# The `quickstart` job is Demo v1 (ADR 0011): the README's 15-minute quickstart
# (scripts/quickstart.sh) on a clean runner, which installs uv, sets up and runs `make demo`.
#
# - merge_group and the nightly schedule run it unconditionally (a merge group has no path filter);
# - pull_request runs it for contracts, the harness and any package's exported-schema paths. If
#   you add a package whose contract.toml names another module, add its path here too (a unit test,
#   test_harness_workflow.py, fails until you do);
# - workflow_dispatch runs it on demand, and posts to the Linear gate issues.
#
# Never `pull_request_target`: the harness runs the PR's own code, so it runs with a read-only
# token. The PR comment is a separate job that checks out nothing and only posts the finished
# report; Linear is posted to only on schedule and dispatch, when LINEAR_API_KEY is set.
on:
  merge_group:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "contracts/**"
      - "harness/**"
      - "scripts/contracts.py"
      - ".github/workflows/harness.yml"
      # Demo v1 (platform ADR 0011): `make demo` and the README's quickstart script
      - "Makefile"
      - "scripts/quickstart.sh"
      # the acceptance corpus's imported generators (ADR 0007 section 3): a change here changes
      # the corpus bytes, which its lock test catches
      - "packages/neptune-deploy/tests/fixtures/archetypes/make_archetypes.py"
      - "packages/neptune-deploy/tests/fixtures/documents/make_document_fixtures.py"
      - "tests/fixtures/mcap/make_mcap.py"
      - "tests/fixtures/rosbag2/make_rosbag2.py"
      - "tests/fixtures/pdf/make_pdfs.py"
      # the compiler: package-schema, alignment-records and lifecycle-records live in its model, and
      # the compiler stage runs the SDK and the store over the corpus
      - "src/neptune/**"
      # each member's exported schemas: catalog-api (api), graph-schema (schema), query-packet
      # (contract), dataset-manifest (manifest); a module or a package of that name
      - "packages/*/src/*/api.py"
      - "packages/*/src/*/api/**"
      - "packages/*/src/*/schema.py"
      - "packages/*/src/*/schema/**"
      - "packages/*/src/*/contract.py"
      - "packages/*/src/*/contract/**"
      - "packages/*/src/*/manifest.py"
      - "packages/*/src/*/manifest/**"
      # the code a real stage runs beyond its contract module: register drives the Ledger's catalog,
      # lake, threads and lineage, with pgserver/psycopg from its dependencies (platform ADR 0006)
      - "packages/neptune-ledger/src/**"
      - "packages/neptune-ledger/pyproject.toml"
      # the deploy stage runs `python -m neptune_deploy map` with Deploy's presets and templates, and
      # its command line imports the pack commands too (platform ADR 0008); ci_plan.py's
      # DEPLOY_STAGE_INPUTS is the same set
      - "packages/neptune-deploy/src/**"
      - "packages/neptune-deploy/pyproject.toml"
      # the memory stage runs `python -m neptune_memory.cli rebuild` with Memory's declaration for
      # the corpus and compares Memory's committed snapshot; the context stage runs Context's local
      # engine and MCP server, and the quickstart wires Claude Code with its sample config and skill
      # (platform ADR 0011); ci_plan.py's AGENT_STAGE_INPUTS is the same set
      - "packages/neptune-memory/src/**"
      - "packages/neptune-memory/pyproject.toml"
      - "packages/neptune-memory/tests/fixtures/acceptance_corpus*"
      - "packages/neptune-context/src/**"
      - "packages/neptune-context/pyproject.toml"
      - "packages/neptune-context/claude/**"
      # every contract's owner tests (`contract_tests` in contracts/*/contract.toml), which
      # `check --all` runs; a unit test fails until a new one is listed here
      - "tests/unit/model/test_schema.py"
      - "tests/integration/test_worked_examples.py"
      - "tests/unit/store/test_ingest_package.py"
      - "packages/neptune-ledger/tests/contract/**"
      - "packages/neptune-ledger/tests/test_ledger_api_contract.py"
      - "packages/neptune-memory/tests/test_reader_contract_memory.py"
      - "packages/neptune-memory/tests/test_golden_graph_memory.py"
      - "packages/neptune-context/tests/test_contract_context.py"
      - "packages/neptune-context/tests/test_packet_goldens_context.py"
      - "packages/neptune-context/tests/test_answer_context.py"
      - "packages/neptune-context/tests/golden/**"

permissions:
  contents: read

concurrency:
  group: harness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python from .python-version
        run: uv python install
      - name: Install workspace and dev tools
        run: make setup
      - name: Harness unit tests (ci.yml's plan does not map harness/** to a package job)
        run: make check PKG=neptune-platform
      - name: Run the harness
        run: make harness HARNESS_RUN_DIR="$RUNNER_TEMP/harness"
      - name: Show the report
        if: always()
        run: cat "$RUNNER_TEMP/harness/report.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: |
            ${{ runner.temp }}/harness/report.json
            ${{ runner.temp }}/harness/report.md
          if-no-files-found: ignore
      - name: Post to the Linear gate issues
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ONLY_FAILED: ${{ github.event_name == 'schedule' && '--only-failed' || '' }}
        # Without LINEAR_API_KEY it posts nothing. A nightly green run stays quiet
        # (--only-failed); a manual run always reports.
        run: uv run --all-packages python -m harness.publish --report "$RUNNER_TEMP/harness/report.json" --link "$RUN_URL" $ONLY_FAILED

  quickstart:
    # The README's quickstart as a new user runs it, on a runner with nothing installed for it:
    # scripts/quickstart.sh installs uv, sets the workspace up and runs `make demo` (the corpus
    # through every real stage, the gold questions through the MCP tools, the PDFs). The timeout is
    # the README's promise: fifteen minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The 15-minute quickstart
        run: bash scripts/quickstart.sh
      - name: Show the demo summary
        if: always()
        run: cat demo/demo.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the demo's PDFs, answers and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo
          path: |
            demo/*.pdf
            demo/*.md
            demo/answers.json
            demo/report.json
          if-no-files-found: ignore

  comment:
    # Same-repository pull requests only: a fork's token cannot write, and its report is not ours.
    needs: harness
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: harness-report
          path: report
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file report/report.md --edit-last --create-if-none
