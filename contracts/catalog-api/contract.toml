title = "Catalog API over ingest packages: packages, entity threads, lineage, current view"
status = "active"
consumers = ["neptune-context", "neptune-deploy", "neptune-learn", "neptune-memory"]

# v0.0.0 is a Platform-authored draft; the Ledger's first real export supersedes it.
[owner]
package = "neptune-ledger"
module = "neptune_ledger.api"
schema_export = "neptune_ledger.api:catalog_schema"
version_constant = "neptune_ledger.api:CATALOG_API_VERSION"
golden_generator = "packages/neptune-ledger/contracts/catalog_goldens.py"
contract_tests = ["packages/neptune-ledger/tests/contract"]
