# Every package that owns or consumes a contract: its Linear project and the gate issue that
# `scripts/contracts.py bump` announces a new contract version on. A package's coordinator moves
# `gate_issue` to the next gate when the current one is Done.

[neptune]
path = "."
linear_project = "P-MVL-11"

[neptune-ledger]
path = "packages/neptune-ledger"
linear_project = "P-MVL-12"
gate_issue = "MVL-89"

